<script>
  function escapeHTML(str) {
      if (str == null || str === false || str === "") return "";   // 0 stays "0" (it used to vanish: 0° showed blank)
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  // Materialise every <i data-lucide> into an <svg>. This used to fail in total silence when
  // the Lucide CDN was blocked: no else, no warning, so "all the icons went blank" looked
  // like an app bug with nothing in the console. Warn once instead.
  var _lucideWarned = false;
  var refreshIcons = function() {
      if (typeof lucide !== 'undefined') {
          try { lucide.createIcons(); } catch (e) { console.warn('[icons] createIcons failed:', e); }
          // Lucide keeps data-lucide on the <svg> it draws, so every call used
          // to redraw EVERY icon on the page — swapping out an icon mid-click
          // (the notification bell only opened when clicked off-centre) and
          // wasting work on each render. Retire the marker once drawn.
          var done = document.querySelectorAll('svg[data-lucide]');
          for (var i = 0; i < done.length; i++) { done[i].setAttribute('data-icon', done[i].getAttribute('data-lucide')); done[i].removeAttribute('data-lucide'); }
          return;
      }
      if (!_lucideWarned) {
          _lucideWarned = true;
          console.warn('[icons] Lucide is not loaded — every icon will render blank. Check whether the CDN in Index.html is reachable from this network (see the loader comment there).');
      }
  };

  // ── GSAP view entrances ──────────────────────────────────────────────────
  // One-shot, GPU-friendly (y + opacity only — no scale, so Chart.js canvases
  // never blur or resize). Animates ONLY on view switches and on the
  // loading→content transition, never on periodic re-renders, and degrades
  // to nothing when GSAP is blocked or the user prefers reduced motion.
  var __lastAnimKey = null;
  function __sliceQ(sel, n) { return Array.prototype.slice.call(document.querySelectorAll(sel), 0, n); }

  // One consistent search field (pill + embedded icon) for every view.
  // ───────────── SHARED PAGE COMPONENTS (the Management view's design system) ─────────────
  // Every page builds from these so the app reads as one product. Styles: the
  // .mv-* rules in CSS.html. Rules of the system: ink text (never series
  // colour), status colour only with an icon/arrow, one y-axis per chart,
  // motion one-shot (entrance / change / hover) — nothing loops at rest.
  //
  // Sticky page header: title, one line of context, controls on the right.
  function pageHeader(title, subHtml, controlsHtml) {
      return '<div class="sticky-header mv-header"><div class="mv-title"><h2>' + title + '</h2>' + (subHtml ? '<div class="mv-sub">' + subHtml + '</div>' : '') + '</div>' +
          (controlsHtml ? '<div class="mv-controls">' + controlsHtml + '</div>' : '') + '</div>';
  }
  // Segmented switch with a sliding pill. items: [[value, label], …];
  // onPick: a global function name called with the value.
  function segControl(items, current, onPick) {
      var idx = 0; items.forEach(function(it, i) { if (it[0] === current) idx = i; });
      return '<div class="mv-seg" style="--i:' + idx + '; --n:' + items.length + ';" role="tablist"><span class="mv-seg-pill"></span>' +
          items.map(function(it) { var on = it[0] === current; return '<button role="tab" aria-selected="' + on + '" class="' + (on ? 'on' : '') + '" onclick="' + onPick + '(\'' + String(it[0]).replace(/'/g, "\\'") + '\')">' + it[1] + '</button>'; }).join('') + '</div>';
  }
  // Number tile: label, value (wrap numbers in <span class="cnum">), an
  // optional change line, a caption. opts.big for the headline size,
  // opts.badge for an on/off-target badge, opts.spark for a trend (mvSpark).
  function kpiTile(label, valueHtml, deltaHtml, capHtml, opts) {
      opts = opts || {};
      return '<div class="aether-card ' + (opts.big ? 'mv-hero-tile' : 'mv-tile') + (opts.cls ? ' ' + opts.cls : '') + '"' + (opts.attrs || '') + '>' +
          '<div class="mv-k">' + label + (opts.badge || '') + '</div><div class="mv-v' + (opts.big ? '' : ' sm') + '">' + valueHtml + '</div>' +
          (deltaHtml != null ? '<div class="mv-d">' + (deltaHtml || '&nbsp;') + '</div>' : '') +
          (opts.spark ? '<div class="mv-spark-wrap">' + opts.spark + '</div>' : '') +
          (capHtml ? '<div class="mv-cap">' + capHtml + '</div>' : '') + '</div>';
  }
  // Section card: title (+ big side figure), one muted line, then the body.
  function sectionCard(title, sideHtml, subHtml, bodyHtml, opts) {
      opts = opts || {};
      return '<div class="aether-card mv-chart-card' + (opts.cls ? ' ' + opts.cls : '') + '"' + (opts.id ? ' id="' + opts.id + '"' : '') + '>' +
          '<div class="mv-sec-h">' + title + (sideHtml ? '<span class="mv-side">' + sideHtml + '</span>' : '') + '</div>' +
          (subHtml ? '<div class="mv-sec-sub">' + subHtml + '</div>' : '') + (bodyHtml || '') + '</div>';
  }
  function mvBadge(tone, icon, txt) { return '<span class="mv-badge ' + tone + '"><i data-lucide="' + icon + '" width="12"></i>' + txt + '</span>'; }
  function mvEmpty(icon, title, sub) { return '<div class="mv-empty"><i data-lucide="' + icon + '" width="22"></i><b>' + title + '</b>' + (sub ? '<span>' + sub + '</span>' : '') + '</div>'; }
  // Chart.js options in the house style (theme-aware): legend top-left with

  function mvChartOpts(o) {
      o = o || {};
      var dk = document.body.classList.contains('dark'), ff = "'Outfit', sans-serif";

      return {
          responsive: true, maintainAspectRatio: false, resizeDelay: 150,
          layout: { padding: { top: 8, right: 8, bottom: 0, left: 0 } },
          interaction: { mode: 'index', intersect: false, axis: 'x' },
          plugins: {
              legend: { display: o.legend !== false, position: 'top', align: 'start', labels: { usePointStyle: true, pointStyle: 'rectRounded', boxWidth: 10, boxHeight: 10, padding: 14, font: { family: ff, weight: '700', size: 11.5 }, color: tc } },
              tooltip: { mode: 'index', intersect: false, backgroundColor: dk ? 'rgba(15,23,42,0.97)' : 'rgba(255,255,255,0.98)', titleColor: dk ? '#e2e8f0' : '#0f172a', bodyColor: dk ? '#cbd5e1' : '#334155', footerColor: dk ? '#cbd5e1' : '#334155',
                  borderColor: dk ? 'rgba(255,255,255,0.14)' : 'rgba(15,23,42,0.12)', borderWidth: 1, padding: 12, cornerRadius: 10, boxPadding: 6, usePointStyle: true,
                  titleFont: { family: ff, weight: '800', size: 13 }, bodyFont: { family: ff, weight: '600', size: 12.5 }, footerFont: { family: ff, weight: '700', size: 12 }, footerMarginTop: 8, callbacks: {} }
          },
          scales: {
              x: { stacked: !!o.stacked, grid: { display: false }, border: { color: gc }, ticks: { font: { family: ff, weight: '700', size: 11 }, color: tc, maxRotation: 0, autoSkip: true } },
              y: { stacked: !!o.stacked, beginAtZero: true, border: { display: false }, grid: { color: gc }, ticks: { font: { family: ff, weight: '600', size: 11 }, color: tc, maxTicksLimit: 6, callback: o.yFmt || undefined } }
          },
          animation: { duration: 650, easing: 'easeOutQuart' }
      };
  }

  // Loading placeholder shaped like the page it stands in for (tiles, then two
  // panels), with one quiet line saying what is loading. Replaces the big
  // spinner cards.
  function skeletonPage(caption) {
      var sk = function(h) { return '<div class="aether-card mv-skel" style="height:' + h + 'px;"></div>'; };
      return '<div class="skel-caption">' + caption + '</div><div class="mv-hero">' + sk(120) + sk(120) + sk(120) + sk(120) + '</div><div class="grid-split">' + sk(380) + sk(380) + '</div>';
  }
  function searchBox(id, placeholder, value, handler, wrapStyle, inputStyle) {
      return '<span class="search-wrap" style="' + (wrapStyle || '') + '"><i data-lucide="search" width="15"></i><input id="' + id + '" type="text" class="input-search" style="' + (inputStyle || '') + '" placeholder="' + placeholder + '" oninput="' + handler + '" value="' + value + '"></span>';
  }
  // MasterList Skills are a SharePoint multi-value cell ("Name;#Lvl;#Name;#Lvl…").
  // Render the skill NAMES as a clean comma list (drop the level tokens).
  function prettySkills(raw) {
      var s = String(raw == null ? '' : raw).trim();
      if (!s) return '';
      if (s.indexOf(';#') !== -1) {
          return s.split(';#').filter(function(t) { t = t.trim(); return t && !/^\d+$/.test(t); }).join(', ');
      }
      return s.split(/[;,]/).map(function(t) { return t.trim(); }).filter(Boolean).join(', ');
  }

  // Split-flap status flip — modern take on the train-departure board.
  // The status cell and dot flip in around the X axis with a back-out
  // settle, and the row washes indigo for a second so the change is
  // findable even in a long list.
  function flipAgentRow(name) {
      if (typeof gsap === 'undefined') return;
      var row = document.querySelector('.agent-row[data-agent="' + encodeURIComponent(name || '') + '"]');
      if (!row) return;
      var parts = [row.querySelector('.row-status'), row.querySelector('.status-dot')].filter(Boolean);
      if (parts.length) {
          gsap.fromTo(parts,
              { rotationX: -90, autoAlpha: 0, transformPerspective: 500, transformOrigin: '50% 50%' },
              { rotationX: 0, autoAlpha: 1, duration: 0.55, ease: 'back.out(1.8)', stagger: 0.06, clearProps: 'transform,opacity,visibility' });
      }
      gsap.fromTo(row,
          { backgroundColor: 'rgba(99,102,241,0.14)' },
          { backgroundColor: 'rgba(99,102,241,0)', duration: 1.1, ease: 'power2.out', clearProps: 'backgroundColor' });
  }

  // Count-up for KPI numbers marked .cnum. Only fires on pure values like
  // "470h", "89%", "+3", "1,689" — anything with nested markup or multiple
  // numbers is left untouched (the regex won't match its textContent).
  // Numbers with a data-ck key count from the value they showed last time
  // (a period switch rolls 82% → 86%, not 0 → 86%); others count up from 0
  // on a view's entrance only.
  var __cnumPrev = {};
  function animateKeyedCountUps() {
      if (typeof gsap === 'undefined') return;
      var reduce = false; try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
      document.querySelectorAll('#content .cnum[data-ck]').forEach(function(el) {
          var k = el.getAttribute('data-ck'), txt = (el.textContent || '').trim();
          var m = txt.match(/^([+\-]?)(\d+)(?:\.(\d+))?(%|h|s)?$/);
          if (!m) { delete __cnumPrev[k]; return; }
          var num = parseFloat((m[1] === '-' ? '-' : '') + m[2] + (m[3] ? '.' + m[3] : ''));
          var from = __cnumPrev.hasOwnProperty(k) ? __cnumPrev[k] : 0;
          __cnumPrev[k] = num;
          if (reduce || from === num) return;
          var dec = m[3] ? m[3].length : 0, suf = m[4] || '', plus = m[1] === '+';
          var o = { v: from };
          gsap.to(o, { v: num, duration: 0.7, ease: 'power2.out', onUpdate: function() { var v = o.v.toFixed(dec); el.textContent = (plus && o.v > 0 ? '+' : '') + v + suf; }, onComplete: function() { el.textContent = txt; } });
      });
  }
  function animateCountUps() {
      if (typeof gsap === 'undefined') return;
      __sliceQ('#content .cnum:not([data-ck])', 24).forEach(function(el) {
          var txt = (el.textContent || '').trim();
          var m = txt.match(/^([+\-]?)(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d+))?(%|h|s|m|×|°)?$/);
          if (!m) return;
          var num = parseFloat(m[2].replace(/,/g, '') + (m[3] ? '.' + m[3] : ''));
          if (!isFinite(num) || num === 0) return;
          var dec = m[3] ? m[3].length : 0;
          var sign = m[1] || '', suf = m[4] || '';
          var useComma = m[2].indexOf(',') !== -1;
          var o = { v: 0 };
          gsap.to(o, { v: num, duration: 0.8, ease: 'power2.out', onUpdate: function() {
              var val = useComma
                  ? Number(o.v.toFixed(dec)).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec })
                  : o.v.toFixed(dec);
              el.textContent = sign + val + suf;
          } });
      });
  }

  // Per-component entrance choreography. Each component family gets its own
  // signature move; everything is y/x + opacity only (GPU-composited, no
  // canvas blur), one-shot, and keyed so periodic re-renders never replay it.
  function animateViewEntrance() {
      if (typeof gsap === 'undefined') return;
      if (document.body.classList.contains('popout-mode')) return;
      try { if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch(e) {}
      var cards = __sliceQ('#content .aether-card', 16);
      var key = state.view + ':' + (cards.length > 2 ? 'full' : 'load');
      if (__lastAnimKey === key) return;
      __lastAnimKey = key;

      var tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
      var header = document.querySelector('#content .sticky-header');
      if (header) tl.from(header, { y: -12, autoAlpha: 0, duration: 0.35, clearProps: 'transform,opacity,visibility' }, 0);
      if (cards.length) tl.from(cards, { y: 18, autoAlpha: 0, duration: 0.5, stagger: 0.05, clearProps: 'transform,opacity,visibility' }, 0.05);
      var rows = __sliceQ('#content .agent-row', 36);
      if (rows.length) tl.from(rows, { x: -14, autoAlpha: 0, duration: 0.3, stagger: 0.014, clearProps: 'transform,opacity,visibility' }, 0.18);
      var chips = __sliceQ('#content .soon-chip', 24);
      if (chips.length) tl.from(chips, { y: 10, autoAlpha: 0, duration: 0.3, stagger: 0.022, clearProps: 'transform,opacity,visibility' }, 0.12);
      var groups = __sliceQ('#content .group-header', 8);
      if (groups.length) tl.from(groups, { autoAlpha: 0, x: -8, duration: 0.35, stagger: 0.05, clearProps: 'transform,opacity,visibility' }, 0.12);
      var heat = __sliceQ('#content .heatmap-cell', 0); // heatmap cells animate via CSS only — too many nodes
      animateCountUps();
  }
  
  // The view's .sticky-header docks flush to the top of the scroll area. Once
  // docked it gets .is-stuck (square top corners, firmer shadow) so nothing
  // can show above or around it. Checked on scroll and after each render.
  function updateStickyHeader() {
      var c = document.getElementById('content'); if (!c) return;
      var hd = c.querySelector('.sticky-header'); if (!hd) return;
      var stuck = c.scrollTop > 0 && (hd.getBoundingClientRect().top - c.getBoundingClientRect().top) <= 1;
      hd.classList.toggle('is-stuck', stuck);
  }
  (function() {
      var bind = function() { var c = document.getElementById('content'); if (c) c.addEventListener('scroll', updateStickyHeader, { passive: true }); };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind); else bind();
  })();

  document.addEventListener('click', function(e) {
      if (!e.target.isConnected) return;   // the click's element was re-rendered away — not an outside click
      var panel = document.getElementById('notif-panel');
      var bellBtn = document.getElementById('btn-bell');
      if (state.notifOpen && panel && !panel.contains(e.target) && (!bellBtn || !bellBtn.contains(e.target))) toggleNotifPanel();
  });

  // Header toggle removed — nav now collapses to icons in CSS via media
  // queries. Stub kept so any stale onclick attributes in cached pages
  // don't throw a ReferenceError.
  window.toggleHeaderActions = function() {};

  // Body-level tooltip for the Red Flags help icons. Rendering inside the
  // card got clipped by the card's overflow:hidden — appending to body and
  // positioning via getBoundingClientRect avoids that entirely.
  window.showRfTip = function(el, ev) {
      hideRfTip();
      var raw = el.getAttribute('data-tip') || '';
      var text = decodeURIComponent(raw);
      var rect = el.getBoundingClientRect();
      var tip = document.createElement('div');
      tip.id = '__rf_tip';
      tip.textContent = text;
      tip.style.cssText = [
          'position:fixed',
          'z-index:99999',
          'max-width:300px',
          'padding:12px 14px',
          'border-radius:10px',
          'font-size:0.75rem',
          'font-weight:500',
          'line-height:1.5',
          'background:#0f172a',
          'color:#f1f5f9',
          'box-shadow:0 12px 32px rgba(0,0,0,0.35)',
          'pointer-events:none',
          'opacity:0',
          'transition:opacity 0.15s'
      ].join(';');
      document.body.appendChild(tip);
      // Position above the icon, clamped to viewport
      var w = tip.offsetWidth, h = tip.offsetHeight;
      var left = Math.min(window.innerWidth - w - 12, Math.max(12, rect.left + rect.width / 2 - w / 2));
      var top  = Math.max(12, rect.top - h - 10);
      tip.style.left = left + 'px';
      tip.style.top  = top + 'px';
      // requestAnimationFrame to trigger transition
      requestAnimationFrame(function() { tip.style.opacity = '1'; });
  };
  window.hideRfTip = function() {
      var existing = document.getElementById('__rf_tip');
      if (existing) existing.parentNode.removeChild(existing);
  };

  // Local "yyyy-mm-dd" — never use toISOString().split('T')[0] for default
  // dates. ISO returns UTC, so at 10 PM Toronto the user is rolled forward
  // a day. This pulls the local-calendar date instead.
  function localDateStr(d) {
      d = d || new Date();
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
  }

  // Build stamp — visible in the Import modal so "is the new code actually
  // deployed?" is answerable at a glance (GAS freezes code per deployment
  // version; pasting files + browser refresh is NOT enough without a new
  // version).
  var APP_BUILD = 'build 2026.06.15-OT44 · OT headline = posted + pre-coded slots (reconciles with the floor count)';

  var state = { 
      view: 'overview', agents: {}, pendingUpdates: {}, weather: {}, slHistory: [], calendarEvents: [], roleLogs: [], statsLogs: [], currentSL: "--", currentACK: "--", selectedAgent: null, searchTerm: "", regionFilter: 'All', notifications: [], knownNotifs: new Set(), dismissedNotifs: new Set(), notifOpen: false, scripts: [], agentTab: 'floor', currentReport: "...", selectedCategory: "All", selectedScriptId: null, editingId: null, appUrl: "", insightMode: 'month', selectedDate: localDateStr(), insightSearch: '', insightRegionFilter: 'All', insightCycleFilter: 'ALL', insightSort: 'total', unifiedReport: null, trackerData: null, trackerMode: 'furlough', trackerDate: localDateStr(), trackerRange: 'day', trackerRegion: 'Onshore', trackerCycleFilter: 'ALL', trackerSearch: '', trackerLoading: true, analyzerData: null, analyzerLoading: false, expandedInsights: new Set(), syncMeta: { sched: "Loading...", idp: "Loading...", muSet: "" }, absencesData: null, selectedAbsenceAgent: null, absenceMonthFilter: 'ALL', outagesData: null, outageHistory: [], outageDrawerProv: null, alarmCom: null, alarmComHistory: [], floorSearch: '', overviewIdp: null, overviewIdpLoading: false, regionRegistry: null, regionManagerFilter: 'ALL', outageCorrelation: null, trainingDefs: [], selectedTrainingId: null, trainingRoster: null, trainingLoading: false, editingTrainingId: null, trackerBucket: 'live', mgmtData: null, mgmtLoading: false, mgmtGrain: 'week', mgmtDate: localDateStr(), safeSelectedAgent: null, safeView: 'agents', safeOpenDay: null, safePins: new Set(), boardAgents: [], boardData: null, boardRangeData: null, boardRoster: null, boardLoading: false, boardDrillDate: null, safeCompareMode: 'day', compareHourStart: 0, compareHourEnd: 1440, scheduleDates: null,
      mgmtShrinkCats: { acsu: true, tower: true, reading: true, breakH: true, lunchH: true, safe: false, coach: false }, mgmtLunchBreaks: true,
      // Supplemental management-week data for charts relocated INTO the trackers
      // (Stacking Lunches → Furlough Tracker, Absence Mix → Absence Tracker).
      trackerAux: null, trackerAuxLoading: false, trackerAuxKey: null,
      // Personalized Management View: per-browser layout (hidden KPI cards +
      // added tracker sections, all on the Sun–Sat management week). Loaded
      // lazily from localStorage via getMgmtLayout().
      mgmtCustomize: false, mgmtLayout: null,
      // Real operational trackers EMBEDDED into the Management View (fetched

      mgmtEmbed: { data: {}, loading: {}, key: {} },
      // Today's stacking-lunch concurrency for the Overview dashboard (daily only).
      overviewLunch: null, overviewLunchLoading: false,
      // Manager feedback + presence/attribution layer.
      currentUser: null, feedbackType: 'suggestion', feedbackList: null, feedbackSubmitting: false, feedbackShowArchive: false,
      presence: [], lastActions: {},
      // Editable Calculator report-template LIBRARY (server-persisted, shared).
      // Loaded lazily when the Calculator view opens via fetchCalcTemplate().
      // calcActive === "" means the built-in default template is in use.
      calcLibLoaded: false, calcActive: "", calcTemplates: [], calcDefault: "", calcDefaultBody: "", calcDefaultCustom: false, calcEditBody: "", calcEditing: false
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initApp);
  else initApp();

  function initApp() {
    try { if (window.Chart && !Chart.__mvMorph) { Chart.register(mvMorphPlugin); Chart.defaults.font.family = "'Outfit', sans-serif"; Chart.__mvMorph = true; } } catch (e) {}
    try { console.log('[MRC] ' + APP_BUILD); var bEl = document.getElementById('import-build'); if (bEl) bEl.textContent = APP_BUILD; } catch(e) {}
    try { if (localStorage.getItem('rta_theme') === 'dark') document.body.classList.add('dark'); } catch(e) {}
    var config = document.getElementById('app-config');
    if (config) {
        state.appUrl = config.getAttribute('data-url');
        var popout = config.getAttribute('data-popout');
        var mode = config.getAttribute('data-mode');
        if (popout === "true") {
            document.body.classList.add('popout-mode');
            state.view = 'popout-view'; 
            state.regionFilter = (mode === 'onshore' ? 'Onshore' : (mode === 'offshore' ? 'Offshore' : (mode === 'breaks' ? 'Breaks' : 'All')));
            document.getElementById('content').innerHTML = '<div style="padding:40px; text-align:center; color:var(--text-muted); font-weight:700;">Loading Floor...</div>';
            if (typeof google !== 'undefined') {
                setInterval(function() { if (!document.hidden) fetchData(); }, 30000); fetchData();
                document.addEventListener('visibilitychange', function() { if (!document.hidden) fetchData(); });
            }
            return;
        }
    }
    render(); 
    // Every poll is skipped while the tab is hidden (no server calls, no
    // re-renders nobody can see); coming back runs them all once, right away.
    var polls = [];
    var every = function(fn, ms) { polls.push(fn); setInterval(function() { if (!document.hidden) fn(); }, ms); };
    document.addEventListener('visibilitychange', function() {
        if (document.hidden) return;
        polls.forEach(function(fn) { try { fn(); } catch (e) {} });

  // as restricted we fetch the same feed from the browser (in Canada). Works

  // "source offline" as before. Result reused for 5 min like the server cache.
  var hqBrowserCache = null;   // { at, data }
  var HQ_REGION_NAMES = { '01': 'Bas-Saint-Laurent', '02': 'Saguenay – Lac-Saint-Jean', '03': 'Capitale-Nationale', '04': 'Mauricie', '05': 'Estrie', '06': 'Montréal', '07': 'Outaouais', '08': 'Abitibi-Témiscamingue', '09': 'Côte-Nord', '10': 'Nord-du-Québec', '11': 'Gaspésie – Îles-de-la-Madeleine', '12': 'Chaudière-Appalaches', '13': 'Laval', '14': 'Lanaudière', '15': 'Laurentides', '16': 'Montérégie', '17': 'Centre-du-Québec' };

  function parseHQBrowser(body) {
      var n = function(v) { v = parseInt(v, 10); return isNaN(v) ? 0 : v; };
      if (body && Array.isArray(body.pannes)) {
          var c = 0; body.pannes.forEach(function(r) { c += n(Array.isArray(r) ? r[0] : (r && (r.nbClient || r.nbClients))); });
          return { outages: body.pannes.length, customers: c, top: [], source: 'Hydro-Québec (via browser)' };
      }
      if (!Array.isArray(body)) return null;
      var glob = null, top = [], tc = 0, tp = 0;
      body.forEach(function(e) {
          e = e || {}; var id = String(e.id == null ? '' : e.id), c = n(e.nbClientInterrompu), p = n(e.nbPanne);
          if (id.toUpperCase() === 'HQ') { glob = { customers: c, outages: p }; return; }
          if (/^\d{2}$/.test(id)) { tc += c; tp += p; if (c > 0 || p > 0) top.push({ region: HQ_REGION_NAMES[id] || ('Region ' + id), customers: c, cause: '—', eta: null }); }
      });
      top.sort(function(a, b) { return b.customers - a.customers; });
      return { outages: glob ? glob.outages : tp, customers: glob ? glob.customers : tc, top: top.slice(0, 10), source: 'Hydro-Québec (via browser)' };
  }

  // state.hqBrowser = { status: 'trying'|'ok'|'failed', reason } — shown on the
  // Québec cell so it's clear whether the browser fallback was tried and why
  // it didn't work.
  function fetchHQFromBrowser(d) {
      if (typeof fetch === 'undefined') return;
      if (hqBrowserCache && Date.now() - hqBrowserCache.at < 300000) { applyHQBrowser(d, hqBrowserCache.data); return; }
      state.hqBrowser = { status: 'trying', reason: '' };
      fetch(d.qcClientUrl, { headers: { 'Accept': 'application/json' } })
          .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
          .then(function(t) {
              var body; try { body = JSON.parse(t); } catch (e) { throw new Error(/restreint|restricted/i.test(t) ? 'geo' : 'format'); }
              var qc = parseHQBrowser(body); if (!qc) throw new Error('format');
              hqBrowserCache = { at: Date.now(), data: qc };
              state.hqBrowser = { status: 'ok', reason: '' };
              if (state.outagesData === d) { applyHQBrowser(d, qc); if (state.view === 'overview') render(); }
          })
          .catch(function(e) {
              var m = (e && e.message) || '';
              var reason = m === 'geo' ? 'blocked by location here too'
                         : m === 'format' ? 'answered, but not with outage data'
                         : /^HTTP/.test(m) ? 'refused (' + m + ')'
                         : "blocked — Hydro-Québec doesn't let other sites read its feed";
              state.hqBrowser = { status: 'failed', reason: reason };

          });
  }

  function mostRecentAction() {

  // Compact "by Name · time" with a small avatar, for inline attribution.

  function renderPresenceRow() {
      var el = document.getElementById('presence-row'); if (!el) return;

      }).join('');

              '<span style="opacity:0.7;">last:</span> ' + escapeHTML(best.label || 'update') + '<br><span style="color:var(--text-secondary);">' + escapeHTML(first) + ' · ' + escapeHTML(timeAgo(best.epoch)) + '</span></div>';

  // ───────────────────────────── Manager feedback ─────────────────────────────
  var FEEDBACK_TYPES = [

  function feedbackTypeMeta(k) { for (var i=0;i<FEEDBACK_TYPES.length;i++) if (FEEDBACK_TYPES[i].key===k) return FEEDBACK_TYPES[i]; return FEEDBACK_TYPES[0]; }
  function nameFromEmail(email) {
      if (!email) return '';

  }
  function currentPageLabel() {

  window.openFeedback = function() {
      var modal = document.getElementById('feedback-modal'); if (!modal) return;
      modal.classList.add('open');
      state.feedbackType = 'suggestion';
      state._feedbackDraft = '';
      state._feedbackPage = currentPageLabel();

      if (!state.currentUser) fetchCurrentUser();
      renderFeedbackBody(true);

          google.script.run.withSuccessHandler(function(res) {
              try { state.feedbackList = normalizeFeedback(JSON.parse(res)); } catch(e) { state.feedbackList = normalizeFeedback(null); }

  };
  window.closeFeedback = function() { var m = document.getElementById('feedback-modal'); if (m) m.classList.remove('open'); };
  window.setFeedbackType = function(t) { state.feedbackType = t; renderFeedbackBody(false); };
  window.toggleFeedbackArchive = function() { state.feedbackShowArchive = !state.feedbackShowArchive; renderFeedbackBody(false); };

  // Backend getFeedbackList now returns {items, archived, isAdmin, statuses,...}.
  // Tolerate the old array shape (and nulls) so nothing breaks mid-deploy.
  function normalizeFeedback(d) {
      if (Array.isArray(d)) return { items: d, archived: [], isAdmin: false, statuses: [], activeCount: d.length, archivedCount: 0 };
      if (d && typeof d === 'object') return { items: d.items || [], archived: d.archived || [], isAdmin: !!d.isAdmin, statuses: d.statuses || [], activeCount: d.activeCount || (d.items ? d.items.length : 0), archivedCount: d.archivedCount || (d.archived ? d.archived.length : 0) };
      return { items: [], archived: [], isAdmin: false, statuses: [], activeCount: 0, archivedCount: 0 };
  }

  // Admin-only: change an item's status (New / Understood / In Progress /
  // Completed / Declined / Archived) so managers see it's handled.
  window.setFeedbackStatus = function(row, status) {
      if (typeof google === 'undefined') { showToast('Preview mode — not saved.'); return; }
      google.script.run.withSuccessHandler(function(res) {
          var r = {}; try { r = JSON.parse(res); } catch(e) {}
          if (r.ok) {
              showToast('Marked ' + (r.status || status));
              google.script.run.withSuccessHandler(function(res2){ try { state.feedbackList = normalizeFeedback(JSON.parse(res2)); } catch(e){} renderFeedbackBody(false); }).getFeedbackList(50);
          } else { showToast('Could not update: ' + (r.error || 'error')); }
      }).withFailureHandler(function(err){ showToast('Update failed: ' + ((err && err.message) || 'backend error')); }).setFeedbackStatus(row, status);
  };

  window.sendFeedback = function() {
      var ta = document.getElementById('feedback-msg');
      var msg = ta ? ta.value.trim() : '';
      if (!msg) { showToast('Please write a message first.'); if (ta) ta.focus(); return; }
      if (state.feedbackSubmitting) return;
      state.feedbackSubmitting = true; state._feedbackDraft = msg;
      renderFeedbackBody(false);
      if (typeof google === 'undefined') { showToast('Preview mode — not submitted.'); state.feedbackSubmitting = false; renderFeedbackBody(false); return; }
      google.script.run.withSuccessHandler(function(res) {
          state.feedbackSubmitting = false;
          var r = {}; try { r = JSON.parse(res); } catch(e) {}
          if (r.ok) {
              showToast('Thanks! Your ' + feedbackTypeMeta(state.feedbackType).label.toLowerCase() + ' was sent.');
              state._feedbackDraft = '';
              google.script.run.withSuccessHandler(function(res2){ try { state.feedbackList = normalizeFeedback(JSON.parse(res2)); } catch(e){} renderFeedbackBody(false); }).getFeedbackList(50);
          } else {
              showToast('Could not send: ' + (r.error || 'unknown error'));
              renderFeedbackBody(false);
          }
      }).withFailureHandler(function(err) {
          state.feedbackSubmitting = false;
          showToast('Send failed: ' + ((err && err.message) || 'backend error'));
          renderFeedbackBody(false);
      }).submitFeedback(state.feedbackType, msg, state._feedbackPage);
  };

  function feedbackStatusColor(s) {
      s = String(s || '').toLowerCase();
      if (/completed/.test(s)) return 'var(--status-active, #10b981)';
      if (/progress/.test(s)) return 'var(--status-warn)';
      if (/understood/.test(s)) return 'var(--accent-primary)';
      if (/declined/.test(s)) return 'var(--status-alert)';
      return 'var(--text-muted)';
  }
  function fbItemHtml(f, data) {
      var m = feedbackTypeMeta(String(f.type||'').toLowerCase());
      var nm = nameFromEmail(f.user) || f.user || 'Unknown';
      var sc = feedbackStatusColor(f.status);
      var right;
      if (data.isAdmin) {
          var opts = (data.statuses||[]).map(function(s){ return '<option value="' + escapeHTML(s) + '"' + (String(f.status).toLowerCase() === s.toLowerCase() ? ' selected' : '') + '>' + escapeHTML(s) + '</option>'; }).join('');
          right = '<select class="fb-st-sel" title="Set status" onchange="setFeedbackStatus(' + f.row + ', this.value)" onclick="event.stopPropagation()" style="color:' + sc + ';">' + opts + '</select>';
      } else {

      }

              '<span class="fb-type"><i data-lucide="' + m.icon + '" width="11"></i>' + escapeHTML(m.label) + '</span>' +
              '<b>' + escapeHTML(nm) + '</b><span style="color:var(--text-muted); font-weight:600;">' + escapeHTML(f.page||'') + '</span>' + right +

  function renderFeedbackBody(focus) {
      var body = document.getElementById('feedback-body'); if (!body) return;
      var typeBtns = segControl(FEEDBACK_TYPES.map(function(t) { return [t.key, '<i data-lucide="' + t.icon + '" width="14"></i>' + t.label]; }), state.feedbackType, 'setFeedbackType');

  // Standalone logomark (three-element mark), height in px.

  function genCloudLogoSvg(h) {

      return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 246 30" aria-label="Genesys Cloud" style="flex-shrink:0;">' + GENESYS_CLOUD_LOGO_PATHS + '</svg>';

  // Genesys ACD queue names all share this prefix; the UI shows the short

  window.copyQueueName = function(e, q) {

  };
  // Inbound agents holding an ICL queue count as ICL for the floor's

  }

  // Queues from the provided list, grouped by service type (EN/FR + tcan).

      ['IVR', ['ivr_default_en','ivr_default_fr']],

      ['Escalation', ['escalation_tcan_en','escalation_tcan_fr']],

  function genAgentByName(name) {
      for (var k in state.agents) {
          if (!Array.isArray(state.agents[k])) continue;
          for (var i = 0; i < state.agents[k].length; i++) { if (state.agents[k][i].name === name) return state.agents[k][i]; }
      }
      return null;
  }

  // Open the Inbound picker (also used by "Assign queues"). Prefills queues.
  window.openGenesysPicker = function(channel) {
      var name = state.selectedAgent; closeMenu();
      var a = genAgentByName(name);
      var pre = (a && a.genesys && a.genesys.channel === 'inbound' && a.genesys.queues) ? a.genesys.queues.slice() : [];
      state.genesysDraft = { name: name, channel: channel || 'inbound', queues: pre };
      document.getElementById('genesys-agent-name').textContent = name;
      var meta = '';
      if (a) { var pfx = (a.region || '').indexOf('Offshore') !== -1 ? 'x' : 'T'; meta = (a.region || '') + (a.id ? ' · ' + pfx + a.id : ''); }
      document.getElementById('genesys-agent-meta').textContent = meta;
      document.getElementById('genesys-mark').innerHTML = genLogoSvg(34);
      document.getElementById('genesys-batch-panel').style.display = 'none';
      document.getElementById('genesys-qsearch').value = '';
      renderGenesysQueues();
      setGenesysChannel(state.genesysDraft.channel);
      document.getElementById('genesys-modal').classList.add('open');
      refreshIcons();
  };
  // Outbound has no queue — assign straight from the menu.
  window.assignGenesysOutbound = function() { closeMenu(); setAgentGenesys('outbound', []); };
  window.removeGenesys = function() { closeMenu(); setAgentGenesys('', []); };

  // ---- Batch assignment: same modal, plus an agent multi-picker ----
  window.openGenesysBatch = function() {
      state.genesysDraft = { batch: true, names: [], channel: 'inbound', queues: [] };
      document.getElementById('genesys-agent-name').textContent = 'Batch assign';
      document.getElementById('genesys-agent-meta').textContent = 'Pick agents, then a channel';
      document.getElementById('genesys-mark').innerHTML = genLogoSvg(34);
      document.getElementById('genesys-batch-panel').style.display = '';
      document.getElementById('genesys-batch-search').value = '';
      document.getElementById('genesys-qsearch').value = '';
      renderGenesysBatchList('');
      renderGenesysQueues();
      setGenesysChannel('inbound');
      document.getElementById('genesys-modal').classList.add('open');
      refreshIcons();
  };
  function renderGenesysBatchList(filter) {
      filter = (filter || '').toLowerCase();
      var sel = {}; (state.genesysDraft.names || []).forEach(function(n) { sel[n] = 1; });
      var list = (state.agents.active || []).slice().sort(function(x, y) { return (x.name || '').localeCompare(y.name || ''); });
      var h = list.map(function(a) {
          var name = a.name || '';
          if (filter && name.toLowerCase().indexOf(filter) === -1) return '';
          var pfx = (a.region || '').indexOf('Offshore') !== -1 ? 'x' : 'T';
          var cur = (a.genesys && a.genesys.channel) ? '<span class="gen-cur">' + (a.genesys.channel === 'inbound' ? 'IN' : 'OUT') + '</span>' : '';
          return '<div class="gen-agent-opt' + (sel[name] ? ' on' : '') + '" data-n="' + escapeHTML(name) + '" onclick="toggleGenesysBatchAgent(this)">' +
                 '<span class="status-dot ' + ((a.region || '').indexOf('Offshore') !== -1 ? 'off' : 'on') + '"></span>' +
                 '<span class="nm">' + escapeHTML(name) + '</span>' +
                 '<span class="id">' + pfx + escapeHTML(a.id || '') + '</span>' + cur + '</div>';
      }).join('');
      document.getElementById('genesys-batch-list').innerHTML = h || '<div class="gen-empty" style="grid-column:1/-1;">No matching active agents.</div>';
      updateGenesysBatchCount();
  }
  window.toggleGenesysBatchAgent = function(el) {
      var name = el.getAttribute('data-n');
      var arr = state.genesysDraft.names || [];
      var idx = arr.indexOf(name);
      if (idx === -1) arr.push(name); else arr.splice(idx, 1);
      state.genesysDraft.names = arr;
      el.classList.toggle('on');
      updateGenesysBatchCount();
  };
  function updateGenesysBatchCount() {
      var el = document.getElementById('genesys-batch-count');
      if (el) el.textContent = '(' + (state.genesysDraft.names || []).length + ' selected)';
  }
  window.filterGenesysBatch = function(v) { renderGenesysBatchList(v); };

  // Move every currently-assigned agent back to Avaya in one save.
  window.returnAllGenesys = function() {
      var names = (state.agents.active || []).filter(function(a) { return a.genesys && a.genesys.channel; }).map(function(a) { return a.name; });
      if (!names.length) { showToast('No one is on Genesys'); return; }
      if (!confirm('Return all ' + names.length + ' agent' + (names.length === 1 ? '' : 's') + ' to Avaya?')) return;
      markGenesysEdit(names, '', []);
      names.forEach(function(n) { applyGenesysInMemory(n, '', []); });
      if (state.view === 'agents') render();
      if (typeof google !== 'undefined') {
          google.script.run
              .withSuccessHandler(function() { ackFloorEdit(names); showToast('Returned ' + names.length + ' to Avaya'); })
              .withFailureHandler(function(err) { failFloorEdit(names, err, 'Return to Avaya'); })
              .updateAgentGenesysBatch(JSON.stringify(names), '', '[]');
      }
  };

  window.setGenesysChannel = function(ch) {
      if (!state.genesysDraft) state.genesysDraft = { channel: ch, queues: [] };
      state.genesysDraft.channel = ch;
      var din = document.getElementById('genesys-seg-in'), dout = document.getElementById('genesys-seg-out');
      var inP = document.getElementById('genesys-inbound-panel'), outP = document.getElementById('genesys-outbound-panel');
      if (ch === 'inbound') { din.className = 'sel-in'; dout.className = ''; inP.style.display = ''; outP.style.display = 'none'; }
      else { dout.className = 'sel-out'; din.className = ''; inP.style.display = 'none'; outP.style.display = ''; }
  };

  function renderGenesysQueues() {
      var picked = {}; (state.genesysDraft.queues || []).forEach(function(q){ picked[q] = 1; });
      var h = GENESYS_QUEUES.map(function(g) {
          var opts = g[1].map(function(q) {
              var base = q.replace(/_(en|fr)$/, ''); var m = q.match(/_(en|fr)$/); var lang = m ? m[1].toUpperCase() : '';
              return '<div class="gen-qopt' + (picked[q] ? ' on' : '') + '" data-q="' + escapeHTML(q) + '" onclick="toggleGenesysQueue(\'' + q + '\')">' + escapeHTML(base) + ' <span class="lang">' + lang + '</span></div>';
          }).join('');
          return '<div class="gen-qgroup" data-g="' + escapeHTML(g[0].toLowerCase()) + '"><h5>' + escapeHTML(g[0]) + '</h5><div class="gen-qlist">' + opts + '</div></div>';
      }).join('');
      document.getElementById('genesys-qgroups').innerHTML = h;
      updateGenesysCount();
  }
  window.toggleGenesysQueue = function(q) {
      var arr = state.genesysDraft.queues || [];
      var idx = arr.indexOf(q);
      if (idx === -1) arr.push(q); else arr.splice(idx, 1);
      state.genesysDraft.queues = arr;
      var el = document.querySelector('#genesys-qgroups .gen-qopt[data-q="' + q + '"]');
      if (el) el.classList.toggle('on');
      updateGenesysCount();
  };
  function updateGenesysCount() { var el = document.getElementById('genesys-qcount'); if (el) el.textContent = '(' + (state.genesysDraft.queues || []).length + ')'; }
  window.filterGenesysQueues = function(v) {
      v = (v || '').toLowerCase();
      var groups = document.querySelectorAll('#genesys-qgroups .gen-qgroup');
      for (var i = 0; i < groups.length; i++) {
          var g = groups[i], any = false, opts = g.querySelectorAll('.gen-qopt');
          for (var j = 0; j < opts.length; j++) {
              var hit = opts[j].getAttribute('data-q').indexOf(v) !== -1 || g.getAttribute('data-g').indexOf(v) !== -1;
              opts[j].style.display = hit ? '' : 'none'; if (hit) any = true;
          }
          g.style.display = any ? '' : 'none';
      }
  };
  window.closeGenesysModal = function() { document.getElementById('genesys-modal').classList.remove('open'); };
  window.saveGenesysAssignment = function() {
      var d = state.genesysDraft; if (!d) return;
      if (d.batch) {
          var names = d.names || [];
          if (!names.length) { showToast('Pick at least one agent'); return; }
          var queues = d.channel === 'inbound' ? (d.queues || []) : [];
          markGenesysEdit(names, d.channel, queues);
          names.forEach(function(n) { applyGenesysInMemory(n, d.channel, queues); });
          if (state.view === 'agents') render();
          // One server call for the whole group — parallel single saves
          // would race on the shared fast-map property.
          if (typeof google !== 'undefined') {
              google.script.run
                  .withSuccessHandler(function() {
                      ackFloorEdit(names);
                      showToast(names.length + ' agent' + (names.length === 1 ? '' : 's') + ' → Genesys ' + (d.channel === 'inbound' ? 'Inbound' : 'Outbound'));
                  })
                  .withFailureHandler(function(err) { failFloorEdit(names, err, 'Genesys batch assignment'); })
                  .updateAgentGenesysBatch(JSON.stringify(names), d.channel, JSON.stringify(queues));
          }
          closeGenesysModal();
          return;
      }
      state.selectedAgent = d.name;
      if (d.channel === 'inbound') setAgentGenesys('inbound', d.queues || []);
      else setAgentGenesys('outbound', []);
      closeGenesysModal();
  };

  function setAgentGenesys(channel, queues) {
      var name = state.selectedAgent;
      markGenesysEdit([name], channel || '', queues || []);
      applyGenesysInMemory(name, channel, queues);
      if (state.view === 'agents') render();
      if (typeof google === 'undefined') return;
      google.script.run
          .withSuccessHandler(function() {
              ackFloorEdit([name]);
              showToast(channel ? ('On Genesys · ' + (channel === 'inbound' ? 'Inbound' : 'Outbound')) : 'Back on Avaya');
          })
          .withFailureHandler(function(err) { failFloorEdit([name], err, 'Genesys assignment'); })
          .updateAgentGenesys(name, channel || '', JSON.stringify(queues || []));
  }
  function setGenesysOnAgent(name, channel, queues) {
      var hasIcl = channel === 'inbound' && (queues || []).some(function(q) { return q.indexOf('icl_') === 0; });
      for (var k in state.agents) {
          if (!Array.isArray(state.agents[k])) continue;
          state.agents[k].forEach(function(a) {
              if (a.name !== name) return;
              a.genesys = channel ? { channel: channel, queues: (queues || []).slice() } : null;
              // Mirror the server rule: ICL queues on Genesys = ICL role on the
              // floor. _genIcl marks roles we derived so we can undo only ours.
              if (hasIcl && (a.role || '').indexOf('ICL') === -1) { a.role = ((a.role || '') + ' ICL').trim(); a._genIcl = true; }
              else if (!hasIcl && a._genIcl) { a.role = (a.role || '').split(/\s+/).filter(function(t) { return t !== 'ICL'; }).join(' '); delete a._genIcl; }
          });
      }
  }
  function applyGenesysInMemory(name, channel, queues) {
      state.pendingGenesys = state.pendingGenesys || {};
      state.pendingGenesys[name] = { channel: channel || '', queues: (queues || []).slice(), timestamp: Date.now() };
      setGenesysOnAgent(name, channel, queues);
  }
  window.openPopout = function(mode) { var baseUrl = state.appUrl || window.location.href.split('?')[0]; var sep = baseUrl.indexOf('?') !== -1 ? '&' : '?'; window.open(baseUrl + sep + "popout=true&mode=" + mode.toLowerCase(), '_blank', 'width=450,height=800,menubar=no,toolbar=no,location=no,status=no'); };

  // kind: 'ok' | 'err' | 'info'; guessed from the wording when not given.
  function showToast(m, kind) {
      var t = document.getElementById('toast'); if(!t) return;
      t.querySelector('#toast-msg').innerText = m;
      kind = kind || (/\b(fail|failed|error|could not|couldn't|not saved|not submitted|missing|required|invalid)\b/i.test(String(m)) ? 'err' : 'ok');
      t.className = 't-' + kind;
      if (typeof gsap !== 'undefined') {
          gsap.killTweensOf(t);
          gsap.fromTo(t, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'back.out(1.6)' });
          gsap.to(t, { y: 20, opacity: 0, duration: 0.35, ease: 'power2.in', delay: 3 });
      } else {
          t.style.opacity='1'; t.style.transform='translateY(0)';
          setTimeout(function(){t.style.opacity='0'; t.style.transform='translateY(20px)';},3000);
      }
  }
  function updateClock() { var el=document.getElementById('clock'); if(!el) return; var t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); if(el.textContent!==t) el.textContent=t; }   // write only on change: no repaint 59 seconds out of 60

  var CALC_LOCAL_DEFAULT = "STATS UPDATE:\nSVL OUT: {svlOut}\nSVL IN: {svlIn}\nACK: {ack}\nASA: {asa}\nLCW Interval: {lcw}\nSAFE: {safe}\n\nTRENDS:\nInbound: {trendIn}\nOutbound: {trendOut}\n\nDELAYS: None\n\nNOTES:\n%% Coaching Open %%";

  // Load the template library from the server. Applies a library payload to

      // lacks the server function, transport stall), surface a diagnostic
      // instead of spinning forever. No-ops if a newer fetch superseded this
      // one or loading already cleared.
      setTimeout(function() {
          if (myToken === trackerFetchToken && state.trackerLoading) {
              state.trackerLoading = false;

  // ── Optimistic floor edits: acknowledgement, rollback, staleness ──────────
  // Every local edit bumps _floorEditSeq. A pending entry is only forgotten once
  // BOTH things are true: the server acknowledged it, and a floor payload
  // requested *after* the edit has landed. Otherwise a getFloorStatus already in
  // flight when you clicked would come back without your change and wipe it.
  var _floorEditSeq = 0;

  function markFloorEdit(names, type, val) {
      _floorEditSeq++;
      (names || []).forEach(function(n) {
          state.pendingUpdates[n] = { type: type, val: val, timestamp: Date.now(), seq: _floorEditSeq, acked: false };
      });
      return _floorEditSeq;
  }
  function markGenesysEdit(names, channel, queues) {
      _floorEditSeq++;
      if (!state.pendingGenesys) state.pendingGenesys = {};
      (names || []).forEach(function(n) {
          state.pendingGenesys[n] = { channel: channel, queues: (queues || []).slice(), timestamp: Date.now(), seq: _floorEditSeq, acked: false };
      });
      return _floorEditSeq;
  }
  function ackFloorEdit(names) {
      (names || []).forEach(function(n) {
          if (state.pendingUpdates[n]) state.pendingUpdates[n].acked = true;
          if (state.pendingGenesys && state.pendingGenesys[n]) state.pendingGenesys[n].acked = true;
      });
      fetchData();   // pull the server's truth; the guard below retires the entry
  }
  // The server rejected the write (quota, locked sheet, permissions). Drop the
  // optimistic patch, say so plainly, and refetch rather than leaving a row
  // showing a change that was never saved.
  function failFloorEdit(names, err, what) {
      (names || []).forEach(function(n) {
          delete state.pendingUpdates[n];
          if (state.pendingGenesys) delete state.pendingGenesys[n];
      });
      showToast((what || 'Change') + ' failed: ' + ((err && err.message) || 'unknown') + ' — reverted');
      fetchData();
  }
  function retireAckedEdits(atSeq) {
      var n;
      for (n in state.pendingUpdates) {
          if (state.pendingUpdates[n].acked && state.pendingUpdates[n].seq <= atSeq) delete state.pendingUpdates[n];
      }
      if (state.pendingGenesys) {
          for (n in state.pendingGenesys) {
              if (state.pendingGenesys[n].acked && state.pendingGenesys[n].seq <= atSeq) delete state.pendingGenesys[n];
          }
      }
  }

  function applyPendingUpdates() {
     var now=Date.now();
     for(var n in state.pendingUpdates) { if(now-state.pendingUpdates[n].timestamp>120000) delete state.pendingUpdates[n]; else moveAgentInMemory(n, state.pendingUpdates[n].type, state.pendingUpdates[n].val); }
     // Genesys assignments race the async save — re-apply the optimistic value
     // over the freshly-fetched payload for a short window.
     if (state.pendingGenesys) { for(var gn in state.pendingGenesys) { if(now-state.pendingGenesys[gn].timestamp>120000) delete state.pendingGenesys[gn]; else setGenesysOnAgent(gn, state.pendingGenesys[gn].channel, state.pendingGenesys[gn].queues); } }
  }
  
  // Patch EVERY copy of the agent and actually move them between buckets.
  // The old version grabbed the first match and `break`ed out — but the server
  // pushes the same agent into `active` AND `safe` (separate objects after
  // JSON.parse), so only one copy got patched and the agent rendered with two
  // different statuses at once. It also never touched bucket membership, so
  // assigning SAFE didn't add them to the SAFE card and Set Active didn't
  // remove them.
  function eachAgentCopy(name, fn) {
      for (var k in state.agents) {
          if (!Array.isArray(state.agents[k])) continue;
          for (var i = 0; i < state.agents[k].length; i++) {
              if (state.agents[k][i] && state.agents[k][i].name === name) fn(state.agents[k][i], k, i);
          }
      }
  }
  function findAgentCopy(name) {
      var found = null;
      eachAgentCopy(name, function(a) { if (!found) found = a; });
      return found;
  }
  // Roles are additive on the server (RoleManager.setStatus appends), so the
  // client has to be additive too or the two disagree the moment a second role
  // is assigned.
  function addRoleToken(current, val) {
      var toks = String(current || '').split(/\s+/).filter(Boolean);
      if (toks.indexOf(val) === -1) toks.push(val);
      return toks.join(' ');
  }
  function removeRoleToken(current, val) {
      return String(current || '').split(/\s+/).filter(Boolean).filter(function(t) { return t !== val; }).join(' ');
  }
  // Keep the role buckets (currently just SAFE) in step with an agent's roles.
  function syncRoleBuckets(name) {
      var a = findAgentCopy(name); if (!a) return;
      var roles = String(a.role || '').toUpperCase();
      [['safe', 'SAFE']].forEach(function(pair) {
          var bucket = pair[0], token = pair[1];
          if (!Array.isArray(state.agents[bucket])) state.agents[bucket] = [];
          var arr = state.agents[bucket];
          var at = -1;
          for (var i = 0; i < arr.length; i++) { if (arr[i] && arr[i].name === name) { at = i; break; } }
          var should = roles.indexOf(token) !== -1;
          if (should && at === -1) arr.push(a);
          else if (!should && at !== -1) arr.splice(at, 1);
      });
  }

  function moveAgentInMemory(name, type, val) {
     var seen = false;
     eachAgentCopy(name, function(o) {
        seen = true;
        if (type === 'role') {
           if (val === 'Active') { o.role = ''; o.subStatus = ''; }
           else o.role = addRoleToken(o.role, val);
        } else if (type === 'role-remove') {
           o.role = removeRoleToken(o.role, val);
           if (!o.role) o.subStatus = '';
        } else if (type === 'absent') {
           o.subStatus = val;
        } else if (type === 'absent-clear') {
           o.subStatus = '';
        }
     });
     if (seen) syncRoleBuckets(name);
  }

  // Charts whose canvas just left the page (view switch / re-render) are

  function gxChan(a) { return (a && a.genesys && a.genesys.channel) || ''; }

  // Queue coverage: the gaps (queues nobody holds) first, then the covered
  // queues thinnest-first. Clicking a queue opens who holds it, the full ACD
  // name and a copy button, right under that queue.
  function renderGenesysCoverage(inbound) {
      var holders = {}, order = [];
      inbound.forEach(function(a) { ((a.genesys && a.genesys.queues) || []).forEach(function(q) { (holders[q] = holders[q] || []).push(a); }); });
      GENESYS_QUEUES.forEach(function(g) { g[1].forEach(function(q) { order.push(q); }); });
      var openQ = state.genesysCovOpen || null;
      var gaps = order.filter(function(q) { return !holders[q]; });
      var covered = order.filter(function(q) { return holders[q]; }).sort(function(x, y) { return holders[x].length - holders[y].length || order.indexOf(x) - order.indexOf(y); });
      var max = covered.reduce(function(m, q) { return Math.max(m, holders[q].length); }, 1);
      var detail = function(q) {
          var who = (holders[q] || []).map(function(a) {
              return '<span class="gen-cov-agent" data-agent="' + encodeURIComponent(a.name || '') + '" onclick="openMenuFromRow(event, this)"><span class="status-dot ' + ((a.region || '').indexOf('Offshore') !== -1 ? 'off' : 'on') + '"></span>' + escapeHTML(a.name || '') + '<span class="id">' + escapeHTML(fmtAgentId(a)) + '</span></span>';
          }).join('');
          return '<div class="gen-cov-detail">' +
                 '<div class="gen-cov-detail-head"><span class="full-name" title="Click to copy" onclick="copyQueueName(event, \'' + q + '\')">' + escapeHTML(GENESYS_QUEUE_PREFIX + q) + '</span>' +
                 '<button class="btn-popout" title="Copy full queue name" onclick="copyQueueName(event, \'' + q + '\')"><i data-lucide="copy" width="13"></i></button><span style="flex:1;"></span>' +
                 '<span class="gx-muted">' + (holders[q] || []).length + ' agent' + ((holders[q] || []).length === 1 ? '' : 's') + '</span></div>' +
                 (who ? '<div class="gen-cov-detail-list custom-scrollbar">' + who + '</div>' : '<div class="gx-muted">No one assigned — click an agent on the floor to add them.</div>') + '</div>';
      };
      var gapHtml = gaps.length
          ? '<div class="gx-lbl"><i data-lucide="alert-triangle" width="13" class="gx-warn"></i> Nobody on ' + gaps.length + ' queue' + (gaps.length === 1 ? '' : 's') + '</div>' +
            '<div class="gx-gaps">' + gaps.map(function(q) { return '<button class="gx-gap' + (q === openQ ? ' open' : '') + '" onclick="toggleGenesysCov(\'' + q + '\')">' + gxQueueLabel(q) + '</button>'; }).join('') + '</div>' +
            (openQ && gaps.indexOf(openQ) !== -1 ? detail(openQ) : '')
          : '<div class="gx-lbl"><i data-lucide="check" width="13" class="gx-ok"></i> Every queue has someone on it</div>';
      var barHtml = covered.map(function(q, i) {
          var n = holders[q].length;
          return '<button class="gx-q' + (q === openQ ? ' open' : '') + '" style="--i:' + Math.min(i, 24) + ';" onclick="toggleGenesysCov(\'' + q + '\')" title="' + escapeHTML(holders[q].map(function(a) { return a.name; }).join(', ')) + '">' +
                 '<span class="nm">' + gxQueueLabel(q) + '</span><span class="track"><i style="width:' + Math.max(4, Math.round(n / max * 100)) + '%;"></i></span><b>' + n + '</b></button>' +
                 (q === openQ ? detail(q) : '');
      }).join('');
      return gapHtml + (covered.length ? '<div class="gx-lbl" style="margin-top:16px;">Covered · thinnest first</div><div class="gx-qbars">' + barHtml + '</div>' : '');
  }
  window.toggleGenesysCov = function(q) {
      state.genesysCovOpen = (state.genesysCovOpen === q) ? null : q;
      render();
      var el = document.querySelector('.gen-cov-detail');
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
  };
  window.toggleGenSoon = function(start, open) {
      state.genSoonOpen = state.genSoonOpen || {};
      state.genSoonOpen[start] = !open;
      render();
  };

  // Headline row, then queue coverage beside the shifts starting later.
  // Everyone is on Genesys, so there is no "on Genesys %" — only which
  // channel each agent has been given.
  function renderGenesysPanel(visible) {
      var inbound = [], out = 0, none = 0, lunch = 0, brk = 0, onN = 0;
      visible.forEach(function(a) {
          var ch = gxChan(a);
          if (ch === 'inbound') inbound.push(a); else if (ch === 'outbound') out++; else none++;
          if (a.onBreakNow) { if (/lunch/i.test(a.subStatus || '')) lunch++; else brk++; }
          if ((a.region || '').indexOf('Offshore') === -1) onN++;
      });
      var heldQ = {}; inbound.forEach(function(a) { ((a.genesys && a.genesys.queues) || []).forEach(function(q) { heldQ[q] = 1; }); });
      var totalQ = 0; GENESYS_QUEUES.forEach(function(g) { totalQ += g[1].length; });
      var nHeld = 0; GENESYS_QUEUES.forEach(function(g) { g[1].forEach(function(q) { if (heldQ[q]) nHeld++; }); });
      var soon = (state.agents.startingSoon || []).filter(floorMatch);
      var next = null; soon.forEach(function(a) { if (a.startEpoch && (!next || a.startEpoch < next.startEpoch)) next = a; });
      var inHour = soon.filter(function(a) { var m = gxMinsTo(a.startEpoch); return m === null || m <= 60; }).length;
      var P = mvPal();
      var cell = function(label, val, cap, sw) {
          return '<div class="gx-kpi"><div class="gx-k">' + (sw ? '<i class="gx-sw" style="background:' + sw + ';"></i>' : '') + label + '</div><div class="gx-v"><span class="cnum">' + val + '</span></div><div class="gx-cap">' + cap + '</div></div>';
      };
      var strip = '<div class="aether-card gx-head">' +
          '<div class="gx-kpis">' +
            cell('On shift', visible.length, onN + ' onshore · ' + (visible.length - onN) + ' offshore') +
            cell('Inbound', inbound.length, nHeld + ' of ' + totalQ + ' queues held', P.s1) +
            cell('Outbound', out, 'callbacks &amp; verification', P.s2) +
            cell('Unassigned', none, none ? 'no channel yet' : 'everyone has a channel', P.neutral) +
            cell('On break', lunch + brk, (lunch || brk) ? lunch + ' lunch · ' + brk + ' break' : 'everyone is working') +
            cell('Starting soon', inHour, next ? 'next at ' + escapeHTML(gxStart(next)) + ' (' + gxWhen(Math.max(0, gxMinsTo(next.startEpoch))) + ')' + (soon.length > inHour ? ' · ' + soon.length + ' later today' : '') : 'no one later today') +
          '</div>' +
          (visible.length ? '<div class="mv-split gx-split" title="Inbound ' + inbound.length + ' · Outbound ' + out + ' · Unassigned ' + none + '">' +
              (inbound.length ? '<span style="flex:' + inbound.length + ' 1 0; background:' + P.s1 + ';"></span>' : '') +
              (out ? '<span style="flex:' + out + ' 1 0; background:' + P.s2 + ';"></span>' : '') +
              (none ? '<span style="flex:' + none + ' 1 0; background:' + P.neutral + ';"></span>' : '') + '</div>' : '') +
          '</div>';

      var covBody = inbound.length ? renderGenesysCoverage(inbound)
          : mvEmpty('phone-incoming', 'No one on inbound yet', 'Every queue is open. Click an agent and choose Genesys Inbound, or use Batch assign.');
      var cov = sectionCard('Queue coverage', '<span class="cnum">' + nHeld + '</span><small class="gx-of"> / ' + totalQ + '</small>',
          'inbound queues held right now · click a queue to see who has it and copy its full name', covBody, { cls: 'gx-cov' });
      return strip + '<div class="grid-split mv-row gx-top">' + cov + renderUpcomingShifts(soon) + '</div>';
  }

  // Shifts starting later today, one block per start time. Blocks within
  // 30 min open by themselves; names are only built for open blocks.
  function renderUpcomingShifts(soon) {
      if (!soon.length) return sectionCard('Starting later today', '<span class="cnum">0</span>', '', mvEmpty('sunset', 'No one else starts today', (state.floorSearch || '').trim() ? 'Nothing matches the search.' : ''), { cls: 'gx-soon' });
      var map = {};
      soon.forEach(function(a) {
          var st = gxStart(a);
          if (!map[st]) map[st] = { start: st, epoch: a.startEpoch || 0, agents: [] };
          if (a.startEpoch && (!map[st].epoch || a.startEpoch < map[st].epoch)) map[st].epoch = a.startEpoch;
          map[st].agents.push(a);
      });
      var list = Object.keys(map).map(function(k) { return map[k]; }).sort(function(x, y) { return (x.epoch || 0) - (y.epoch || 0); });
      var openMap = state.genSoonOpen || {};
      var blocks = list.map(function(g, gi) {
          var mins = g.epoch ? Math.max(0, gxMinsTo(g.epoch)) : null;
          var imminent = mins !== null && mins <= 30;
          var open = openMap.hasOwnProperty(g.start) ? openMap[g.start] : imminent;
          var startJs = escapeHTML(g.start).replace(/'/g, "\\'");
          var names = open ? '<div class="gx-soon-names">' + g.agents.map(function(a) {
              return '<span class="gx-soon-chip" title="' + escapeHTML((a.name || '') + ' — ' + (a.shift || '')) + '"><span class="status-dot ' + ((a.region || '').indexOf('Offshore') !== -1 ? 'off' : 'on') + '"></span><span class="nm">' + escapeHTML(a.name || '') + '</span><span class="id">' + escapeHTML(fmtAgentId(a)) + '</span></span>';
          }).join('') + '</div>' : '';
          return '<div class="gx-blk' + (open ? ' open' : '') + '">' +
                 '<div class="gx-blk-h" onclick="toggleGenSoon(\'' + startJs + '\', ' + open + ')">' +
                   '<i data-lucide="chevron-right" width="14" class="gx-chev"></i>' +
                   '<span class="t">' + escapeHTML(g.start) + '</span>' +
                   (mins !== null ? '<span class="w' + (imminent ? ' soon' : '') + '">' + gxWhen(mins) + '</span>' : '') +
                   '<span style="flex:1;"></span><span class="n">' + g.agents.length + ' agent' + (g.agents.length === 1 ? '' : 's') + '</span>' +
                   '<button class="btn-popout" title="Copy this shift block (name + ID)" onclick="event.stopPropagation(); copyShiftBlock(\'' + startJs + '\')"><i data-lucide="copy" width="13"></i></button>' +
                 '</div>' + names + '</div>';
      }).join('');
      return sectionCard('Starting later today', '<span class="cnum">' + soon.length + '</span>', 'grouped by start time · copy a block for the handover', '<div class="gx-blks">' + blocks + '</div>', { cls: 'gx-soon' });
  }

  function renderFloorLayout(upMap) {
     var act = state.agents.active || [];
     var rows = function(list) { return list.map(function(a) { return renderAgentRow(a, upMap[a.id]); }).join(''); };
     var term = (state.floorSearch || '').trim();
     var unit = function(region, label) {
         var list = act.filter(function(a) { return (a.region || '').indexOf(region) !== -1; }).filter(floorMatch);
         var nIn = 0, nOut = 0, nBrk = 0;
         list.forEach(function(a) { var ch = gxChan(a); if (ch === 'inbound') nIn++; else if (ch === 'outbound') nOut++; if (a.onBreakNow) nBrk++; });
         var hidden = state.regionFilter !== 'All' && state.regionFilter !== region;
         if (hidden) return '';
         return '<div class="aether-card mv-chart-card long-list gx-unit">' +
             '<div class="mv-sec-h">' + label + '<span class="gx-acts"><b>' + list.length + '</b> on shift' +
               '<button class="btn-popout" title="Copy ' + region + ' roster (name, ID, shift, break)" onclick="copyUnitRoster(\'' + region + '\')"><i data-lucide="copy" width="13"></i></button>' +
               '<button class="btn-popout" title="Pop out ' + region + '" onclick="openPopout(\'' + region + '\')"><i data-lucide="external-link" width="13"></i></button></span></div>' +
             '<div class="mv-sec-sub">' + nIn + ' inbound · ' + nOut + ' outbound · ' + nBrk + ' on break</div>' +
             (list.length ? '<div class="agent-list-view gx-list">' + rows(list) + '</div>' : mvEmpty('users', term ? 'No one matches' : 'No one on shift', term ? 'Try a name, ID, supervisor or queue.' : '')) + '</div>';
     };
     var units = unit('Onshore', 'Onshore unit') + unit('Offshore', 'Offshore unit');
     var html = '';
     var safe = (state.agents.safe || []).filter(floorMatch);
     if (safe.length) html += sectionCard('SAFE', '<span class="cnum">' + safe.length + '</span>', 'agents on the SAFE role', '<div class="agent-list-view gx-list">' + rows(safe) + '</div>', { cls: 'gx-unit mv-row' });
     html += '<div class="' + (state.regionFilter === 'All' ? 'grid-split ' : '') + 'mv-row gx-floor">' + units + '</div>';
     var need = (state.agents.unplanned || []).filter(floorMatch);
     var planned = [].concat(state.agents.vacation || [], state.agents.training || [], state.agents.planned || []).filter(floorMatch);
     html += '<div class="grid-split mv-row gx-floor">' +
         sectionCard('Needs attention', '<span class="cnum">' + need.length + '</span>', 'unplanned absences today', need.length ? '<div class="agent-list-view gx-list">' + rows(need) + '</div>' : mvEmpty('check-circle', 'No unplanned absences', ''), { cls: 'gx-unit' + (need.length > 12 ? ' long-list' : '') }) +
         sectionCard('Planned / support', '<span class="cnum">' + planned.length + '</span>', 'vacation, training and planned time off', planned.length ? '<div class="agent-list-view gx-list">' + rows(planned) + '</div>' : mvEmpty('calendar', 'Nothing planned today', ''), { cls: 'gx-unit gx-dim' + (planned.length > 12 ? ' long-list' : '') }) +
         '</div>';
     if (term) {
         var off = (state.agents.off || []).filter(floorMatch);
         if (off.length) html += sectionCard('Offline / not active', '<span class="cnum">' + off.length + '</span>', 'matches among agents who are not on shift', '<div class="agent-list-view gx-list">' + rows(off) + '</div>', { cls: 'gx-unit gx-dim mv-row' + (off.length > 12 ? ' long-list' : '') });
     }
     return html;
  }

  // One matcher for every Floor list, so the search box and the On/Off toggle
  // narrow the whole page consistently. Previously each list rolled its own and
  // the Upcoming Shifts chips consulted neither.
  // Level / language chips. These lived as locals inside the SAFE renderer and had
  // already been copy-pasted once; hoisted here so the Floor, SAFE board and the
  // read-only copy all render an agent's attributes identically.
  // Level can be the string 'Trainee' as well as 1-4, so don't assume a number.
  function agentLvlChip(lv) {
      if (lv === null || lv === undefined || lv === '') return '';
      var isTrainee = /^trainee$/i.test(String(lv));
      var n = parseInt(lv, 10);
      var senior = !isTrainee && n >= 4;
      var label = isTrainee ? 'TRAINEE' : ('L' + (isFinite(n) ? n : lv));
      var col = isTrainee ? 'var(--status-warn)' : (senior ? 'var(--status-role)' : 'var(--text-secondary)');
      var bg = isTrainee ? 'rgba(217,119,6,0.12)' : (senior ? 'rgba(124,58,237,0.12)' : 'rgba(0,0,0,0.05)');
      return '<span class="attr-chip" style="color:' + col + '; background:' + bg + ';" title="' + (isTrainee ? 'Trainee' : ('ERC level ' + lv)) + '">' + label + '</span>';
  }
  function agentLangChip(lang) {
      var l = String(lang || '').toUpperCase();
      if (['EN','FR','BL'].indexOf(l) === -1) return '';
      var col = l === 'BL' ? 'var(--status-active)' : (l === 'FR' ? 'var(--accent-primary)' : 'var(--text-secondary)');
      var bg = l === 'BL' ? 'rgba(5,150,105,0.12)' : (l === 'FR' ? 'rgba(79,70,229,0.12)' : 'rgba(0,0,0,0.05)');
      var full = l === 'BL' ? 'Bilingual' : (l === 'FR' ? 'French' : 'English');
      return '<span class="attr-chip" style="color:' + col + '; background:' + bg + ';" title="' + full + '">' + l + '</span>';
  }
  // Each role gets its own chip with an × — roles stack on the server, and
  // "Set Active" (which wipes them all) used to be the only way to remove one.
  function agentRoleChips(a) {
      var toks = String((a && a.role) || '').split(/\s+/).filter(Boolean);
      if (!toks.length) return '';
      // The role travels in a data attribute and the agent is read off the
      // enclosing row, so no name is ever interpolated into the handler.
      return toks.map(function(t) {
          return '<span class="attr-chip role" title="' + escapeHTML(t) + '">' + escapeHTML(t) +
                 '<button class="attr-x" data-role="' + encodeURIComponent(t) + '" title="Remove ' + escapeHTML(t) + '" onclick="removeAgentRoleFromEl(event, this)">&times;</button></span>';
      }).join('');
  }

  function floorMatch(a) {
      if (!a) return false;
      var reg = a.region || '';
      if (state.regionFilter !== 'All' && reg.indexOf(state.regionFilter) === -1) return false;
      var term = (state.floorSearch || '').trim().toLowerCase();
      if (!term) return true;
      // Search across the things actually shown on the row, not just the name.
      var hay = [a.name, a.id, a.tid, a.manager, a.lang, a.level, a.role, a.subStatus, a.shift, reg, ((a.genesys && a.genesys.queues) || []).join(' ')]
          .map(function(v) { return v == null ? '' : String(v); })
          .join(' ').toLowerCase();
      return hay.indexOf(term) !== -1;
  }

  function renderGroup(list, upMap) {
      if (!list) return '';
      var filtered = list.filter(floorMatch);
      if(!filtered.length) return '';
      return filtered.map(function(a){return renderAgentRow(a, upMap[a.id]);}).join('');
  }

  // Agent ID as shown on the floor: T-prefix for Onshore (TID), x for Offshore (XID).
  function fmtAgentId(a) { var prefix = (a.region || '').indexOf('Offshore') !== -1 ? 'x' : 'T'; return prefix + (a.id || ''); }
  // Tab-separated roster: Name + ID (TID/XID) + shift start/end. No "Active"
  // noise — the Break column is only filled when the agent is actually out on
  // a break/lunch (with its window). Pastes cleanly into Sheets/Excel.
  function buildRosterText(list) {
      var lines = ['Name\tID\tStart\tEnd\tBreak'];
      list.forEach(function(a) {
          var start = '', end = '';
          if (a.shift && a.shift.indexOf(' - ') !== -1) { var p = a.shift.split(' - '); start = p[0]; end = p[1]; }
          var brk = a.onBreakNow ? ((a.subStatus || 'Break') + (a.currentBreakStr ? ' ' + a.currentBreakStr : '')) : '';
          lines.push((a.name || '') + '\t' + fmtAgentId(a) + '\t' + start + '\t' + end + '\t' + brk);
      });
      return lines.join('\n');
  }
  // Copy everyone currently on shift in a unit (any status — working, break,
  // lunch, role), each tagged with status + TID (Onshore) / XID (Offshore).
  window.copyUnitRoster = function(region) {
      var list = (state.agents.active || []).filter(function(a){ return (a.region || '').indexOf(region) !== -1; });
      if (!list.length) { showToast('No ' + region + ' agents on shift'); return; }
      list = list.slice().sort(function(a, b){ return (a.name || '').localeCompare(b.name || ''); });
      fallbackCopyTextToClipboard(buildRosterText(list), 'Copied ' + list.length + ' ' + region + ' agent' + (list.length === 1 ? '' : 's'));
  };
  // Copy one upcoming shift block (agents whose shift starts at startStr).
  window.copyShiftBlock = function(startStr) {
      var list = (state.agents.startingSoon || []).filter(function(a){ var s = (a.shift && a.shift.indexOf(' - ') !== -1) ? a.shift.split(' - ')[0] : ''; return s === startStr; });
      if (!list.length) { showToast('No agents in that block'); return; }
      list = list.slice().sort(function(a, b){ return (a.name || '').localeCompare(b.name || ''); });
      fallbackCopyTextToClipboard(buildRosterText(list), 'Copied ' + list.length + ' agent' + (list.length === 1 ? '' : 's') + ' (' + startStr + ')');
  };

  // Channel cell: In / Out tag (swatch matches the headline split) and the
  // first queues. Chips copy the full queue name.
  function agentGenesysLine(a) {
      var ch = gxChan(a);
      if (!ch) return '<div class="gx-chan"></div>';
      var isIn = ch === 'inbound', P = mvPal();
      var h = '<span class="gx-tag"><i style="background:' + (isIn ? P.s1 : P.s2) + ';"></i>' + (isIn ? 'In' : 'Out') + '</span>';
      if (isIn) {
          var qs = a.genesys.queues || [];
          if (qs.length) {
              // As many chips as fit the cell (by name length), then "+n".
              var shown = [], used = 0;
              for (var qi = 0; qi < qs.length && shown.length < 2; qi++) { if (shown.length && used + qs[qi].length > (qs.length > 2 ? 17 : 22)) break; shown.push(qs[qi]); used += qs[qi].length; }
              h += shown.map(function(q) { return '<span class="qchip" title="Click to copy: ' + escapeHTML(GENESYS_QUEUE_PREFIX + q) + '" onclick="copyQueueName(event, \'' + escapeHTML(q) + '\')">' + escapeHTML(q) + '</span>'; }).join('');
              if (qs.length > shown.length) h += '<span class="qchip more" title="' + escapeHTML(qs.slice(shown.length).join(', ')) + '">+' + (qs.length - shown.length) + '</span>';
          } else {
              h += '<span class="gx-noq"><i data-lucide="alert-triangle" width="12"></i>No queue</span>';
          }
      }
      return '<div class="gx-chan">' + h + '</div>';
  }

  // One roster row: dot · name (ID + attributes under it) · status (and what
  // is next) · channel + queues · shift or break window. Plain "Active"
  // recedes so breaks, absences and shift ends are what the eye lands on.
  function renderAgentRow(a, upInfo) {
     var start = "00:00", end = "00:00";
     if (a.shift && a.shift.indexOf("?") === -1) { var parts = a.shift.split(' - '); if(parts.length===2){ start=parts[0]; end=parts[1]; } }
     var dot = (a.region || '').indexOf('Onshore') !== -1 ? 'on' : 'off';
     // Same absence list as the server's Needs Attention rule.
     if(a.subStatus && a.subStatus.match(/SICK|NCNS|\bUNAB\b|AWOL|\bCOMPU?\b|\bALU\b|\bLOA\b|PW\/ALT|PERSONAL|WELLNESS|BEREAVEMENT/i)) dot = 'alert';
     if(a.onBreakNow) dot = 'break';
     var quiet = !a.subStatus && !a.onBreakNow;
     var statusText = escapeHTML(a.subStatus) || 'Active';
     var next = [];
     if (a.onBreakNow && a.timer) next.push(escapeHTML(a.timer) + ' left');
     else if (upInfo && upInfo.nextBreakType && upInfo.startsIn) next.push(escapeHTML(upInfo.nextBreakType) + ' in ' + escapeHTML(upInfo.startsIn));
     if (a.shiftEndsIn) next.push('<span class="gx-ends">shift ends in ' + escapeHTML(a.shiftEndsIn) + '</span>');

     var formattedId = escapeHTML(fmtAgentId(a));
     var timeDisplay = escapeHTML(start) + "–" + escapeHTML(end);
     if (!a.shift || a.shiftType === 'Off' || a.subStatus === 'Scheduled Off') timeDisplay = "Off";
     // While on break/lunch the time slot shows the break window itself:
     // "out from X until Y" instead of the shift hours.
     var onBrk = a.onBreakNow && a.currentBreakStr;
     if (onBrk) timeDisplay = escapeHTML(a.currentBreakStr).replace(/ - /, '–');

     var attrTitle = [];
     if (a.level) attrTitle.push('Level ' + a.level);
     if (a.lang) attrTitle.push(a.lang);
     if (a.manager) attrTitle.push('Sup: ' + a.manager);
     if (a.region) attrTitle.push(a.region);
     if (a.skills) attrTitle.push(prettySkills(a.skills));
     var meta = '<div class="gx-meta" title="' + escapeHTML(attrTitle.join(' · ')) + '">' +
                '<span class="gx-id" onclick="copyAgentInfo(event, \'' + formattedId + '\')" title="Copy ID">' + formattedId + '</span>' +
                agentLvlChip(a.level) + agentLangChip(a.lang) + agentRoleChips(a) +
                (a.manager ? '<span class="attr-chip sup" title="Supervisor: ' + escapeHTML(a.manager) + '">' + escapeHTML(String(a.manager).split(/[ ,]/)[0]) + '</span>' : '') + '</div>';

     return '<div class="agent-row gx-row" data-agent="' + encodeURIComponent(a.name || '') + '" onclick="openMenuFromRow(event, this)">' +
            '<div class="status-dot ' + dot + '"></div>' +
            '<div class="gx-who"><div class="row-name">' + escapeHTML(a.name || '') + '</div>' + meta + '</div>' +
            '<div class="gx-mid"><div class="row-status' + (quiet ? ' quiet' : '') + '"><span class="st">' + statusText + (a.isOT ? '<span class="gx-ot">OT</span>' : '') + '</span>' +
              (next.length ? '<span class="nx">' + next.join(' · ') + '</span>' : '') + '</div>' + agentGenesysLine(a) + '</div>' +
            '<div class="row-time' + (onBrk ? ' brk' : '') + '">' + timeDisplay + '</div></div>';
  }

  // Read the agent off the element instead of interpolating the name into an
  // inline handler — that was a SyntaxError for any name with an apostrophe.
  window.openMenuFromRow = function(e, el) {
      var raw = el && el.getAttribute('data-agent');
      var name = '';
      try { name = decodeURIComponent(raw || ''); } catch (err) { name = raw || ''; }
      openMenu(e, name);
  };

  window.removeAgentRoleFromEl = function(e, el) {
      e.stopPropagation();
      var row = el;

  var __dashEnterAt = 0;

  // The reading closest to an hour before the newest one (at least 40 min back).

  // Alarm.com standby status. Four states: up, issue (the status page reports

  function dashAlarmCard() {

      var label = st === 'up' ? 'All systems operational' : (st === 'issue' ? 'Issue reported' : (st === 'unknown' ? 'Site reachable · status unknown' : 'Unreachable'));

      var reason = (st === 'issue' || st === 'down') ? (d.error || d.note || ('HTTP ' + d.statusCode)) : '';
      var status = '<div class="dash-al-st">' + (st === 'up' ? '<span class="dash-al-ok"><i data-lucide="shield-check" width="20"></i></span>'

      if (d.lastGoodChecked) facts.push('last good ' + escapeHTML(d.lastGoodChecked));
      // null = not readable, so show nothing rather than a bare "?"; and only
      // when the page answered, so an unreachable host implies no healthy part.
      var chip = (d.isReachable && d.partnerPortalUp != null) ? '<div class="dash-al-chip"><span class="outage-chip">Partner Portal · <b>' + (d.partnerPortalUp ? 'Up' : 'Down') + '</b></span></div>' : '';
