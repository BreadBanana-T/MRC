  // Draws a target line and shades the good side of it (above for SL, below
  // for ACK). Passed per chart, not registered globally.
  var dashRefBand = {
      id: 'dashRefBand',
      beforeDatasetsDraw: function(chart, args, o) {
          if (!o || o.value == null) return;
          var y = chart.scales.y, a = chart.chartArea, ctx = chart.ctx, at = y.getPixelForValue(o.value);
          if (at < a.top || at > a.bottom) return;
          var top = o.above ? a.top : at, bot = o.above ? at : a.bottom;
          ctx.save();
          ctx.fillStyle = o.fill; ctx.fillRect(a.left, top, a.right - a.left, bot - top);
          ctx.beginPath(); ctx.moveTo(a.left, at); ctx.lineTo(a.right, at);
          ctx.lineWidth = 1; ctx.setLineDash([5, 4]); ctx.strokeStyle = o.line; ctx.stroke();
          // Label on the left: the newest reading (right edge) stays clear.
          ctx.setLineDash([]); ctx.font = "700 10px 'Outfit', sans-serif"; ctx.textAlign = 'left';
          var ty = o.above ? at - 5 : at + 12, tw = ctx.measureText(o.label).width;
          ctx.fillStyle = o.bg; ctx.fillRect(a.left + 2, ty - 9, tw + 6, 12);
          ctx.fillStyle = o.text; ctx.fillText(o.label, a.left + 5, ty);
          ctx.restore();
      }
  };
  // Dashed "now" marker on the stacking-breaks chart.
  var dashNowLine = {
      id: 'dashNowLine',
      afterDatasetsDraw: function(chart, args, o) {
          if (!o || o.index == null) return;
          var x = chart.scales.x.getPixelForValue(o.index), a = chart.chartArea, ctx = chart.ctx;
          if (!(x >= a.left && x <= a.right)) return;
          ctx.save(); ctx.beginPath(); ctx.moveTo(x, a.top); ctx.lineTo(x, a.bottom);
          ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]); ctx.strokeStyle = o.color; ctx.stroke();
          ctx.setLineDash([]); ctx.fillStyle = o.color; ctx.font = "700 10px 'Outfit', sans-serif"; ctx.textAlign = 'left';
          ctx.fillText('now', x + 4, a.top + 10);
          ctx.restore();
      }
  };
  // Rebuild a chart on its canvas; animate only when its data (or the theme)

  // Called from render() for the overview: SL, ACK and stacking breaks.

      var H = dashSlHist(), labels = H.map(function(p) { return p.name || ''; });
      var sl = H.map(function(p) { return Number(p.val); }), ack = H.map(function(p) { var v = Number(p.ack); return isFinite(v) ? v : null; });

      });

              pointBackgroundColor: function(c) { return bad(c.raw) ? P.bad : P.s1; } };

          os.scales.x.ticks.maxTicksLimit = 8;

          '<div class="mdl-h"><span class="mdl-ic"><i data-lucide="' + icon + '" width="18"></i></span><div class="mdl-tt"><h3 id="' + id + '-t">' + title + '</h3>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>' +

  }
  // Esc closes the top modal through its own backdrop handler (so each modal's

  document.addEventListener('keydown', function(e) {

      var t = e.target;
      if ((e.key === 'Enter' || e.key === ' ') && t && t.classList && t.classList.contains('ins-r')) { e.preventDefault(); t.click(); }

  // ───────────────────────────── Red Flags ─────────────────────────────
  // One table per rule (the rules live in AssignmentAnalyzer.gs and
  // getCoachingCadenceFlags). Every row is already a flag, so numbers stay

  // part is in the status colour.
  var RF_SECTIONS = [
      { k: 'in', list: 'inbound', src: 'gem', title: 'Inbound red flags', short: 'Inbound', icon: 'phone-incoming',
        rule: 'In-time 75%+ and calls are half or more of their tasks', act: 'balance with outbound work',
        tip: 'Display agents that have unbalanced In% results and also have the majority of their tasks being Calls. This confirms without a doubt that these agents need balancing through more Outbound assignments.' },
      { k: 'out', list: 'outbound', src: 'gem', title: 'Outbound red flags', short: 'Outbound', icon: 'phone-outgoing',
        rule: 'Out-time 75%+ at Level 2 or above', act: 'give them more inbound calls',
        tip: 'Display agents that have unbalanced Out% results while being Level 2+. These agents will require more Inbound tasks (Calls) in order to be correctly balanced.' },
      { k: 'scope', list: 'outOfScope', src: 'gem', title: 'Inbound, out of scope', short: 'Out of scope', icon: 'scale',
        rule: 'In-time 75%+ but most of their tasks are outbound', act: 'no balancing needed, adjust if convenient',
        tip: "Display agents that have unbalanced In% results but that have most of their tasks being Outbound tasks meaning they aren't technically in need of balancing, but could be adjusted." },
      { k: 'cph', list: 'cph', src: 'gem', title: 'Low CP/H', short: 'CP/H', icon: 'trending-down',
        rule: 'CP/H at or under 7.3', act: 'pause specialised tasks (SAFE, BMRC, ULC LS) for a while',
        tip: "Display agents that have critically low CP/H which are being harmful to that agent's targets and quarterly goals. They should avoid specialized tasks (SAFE, BMRC, ULC LS..) and focus on Inbound or Outbound in normal quantity for a moment." },
      { k: 'drop', list: 'noAnswer', src: 'genesys', title: 'Dropped calls', short: 'Dropped', icon: 'phone-missed',
        rule: function() { return 'Rang out on ' + Math.round(GENESYS_DROP_RATE * 100) + '%+ of answered calls (' + GENESYS_DROP_MIN_ANSWERED + '+ answered)'; }, act: 'check their phone status and ready time' },
      { k: 'short', list: 'shortCalls', src: 'genesys', title: 'Short calls', short: 'Short calls', icon: 'timer-off',
        rule: function() { return 'Average talk at or under ' + Math.round(GENESYS_SHORT_TALK_FACTOR * 100) + '% of the floor median'; }, act: 'listen to a few calls' },
      { k: 'coach', src: 'coach', title: 'Coaching overdue', short: 'Coaching', icon: 'clock',

  function rfSectionList(sec, d) {

  }

  }

  // Meter on a 0..max scale with the rule's line at t. dir 'over': past the
  // line is bad (status colour from t to v); 'under': the shortfall from v up
  // to t is shown instead.
  function rfMeter(v, t, max, dir, i) {
      var p = function(x) { return Math.max(0, Math.min(100, x / max * 100)).toFixed(1); };
      var base = dir === 'over' ? Math.min(v, t) : v;
      var flag = dir === 'over' ? (v > t ? '<em style="left:' + p(t) + '%; width:' + (p(v) - p(t)).toFixed(1) + '%;"></em>' : '')
                                : (v < t ? '<em class="gap" style="left:' + p(v) + '%; width:' + (p(t) - p(v)).toFixed(1) + '%;"></em>' : '');
      return '<span class="rf-meter"><span class="rf-fill" style="--i:' + (i || 0) + ';"><i style="width:' + p(base) + '%;"></i>' + flag + '</span><b style="left:' + p(t) + '%;"></b></span>';
  }
  // Change vs last month: arrow + value; colour only says better / worse.
  function rfTrend(v, prev, badUp, fmt) {
      if (prev == null) return '<span class="rf-d flat" title="Not in last month\'s report">new</span>';
      if (!isFinite(v) || Math.abs(v) < 0.0005) return '<span class="rf-d flat">no change</span>';
      var worse = badUp ? v > 0 : v < 0;
      return '<span class="rf-d ' + (worse ? 'bad' : 'good') + '" title="' + (worse ? 'Worse' : 'Better') + ' than last month">' + (v > 0 ? '▲ ' : '▼ ') + fmt(Math.abs(v)) + '</span>';
  }

  function rfTable(sec, list, d, also) {
      var g = d.genesys || {}, cad = state.coachingCadence || {};
      var pct = function(x) { return (x * 100).toFixed(1) + '%'; }, pts = function(x) { return (x * 100).toFixed(1) + ' pts'; };
      var head, cells;
      if (sec.k === 'in' || sec.k === 'scope' || sec.k === 'out') {
          var isOut = sec.k === 'out';
          head = ['Agent', isOut ? 'Out-time' : 'In-time', 'vs last month'].concat(isOut ? [] : ['Calls share']).concat(['Days']);
          cells = function(a, i) {
              var v = isOut ? (a.outPct || 0) : (a.inPct || 0);
              return '<td class="rf-v"><span class="rf-num">' + pct(v) + '</span>' + rfMeter(v * 100, 75, 100, 'over', i) + '</td>' +
                  '<td>' + rfTrend(isOut ? a.trendOut : a.trendIn, isOut ? a.prevOut : a.prevIn, true, pts) + '</td>' +
                  (isOut ? '' : '<td class="n">' + Math.round((a.tasksXCalls || 0) * 100) + '%</td>') + '<td class="n">' + escapeHTML(a.wDays || '–') + '</td>';
          };
      } else if (sec.k === 'cph') {
          var top = Math.max(9, list.reduce(function(m, a) { return Math.max(m, a.cph || 0); }, 0));
          head = ['Agent', 'CP/H', 'vs last month', 'Tasks', 'Days'];
          cells = function(a, i) {
              return '<td class="rf-v"><span class="rf-num">' + (a.cph || 0).toFixed(2) + '</span>' + rfMeter(a.cph || 0, 7.3, top, 'under', i) + '</td>' +
                  '<td>' + rfTrend(a.trendCph, a.prevCph, false, function(x) { return x.toFixed(2); }) + '</td>' +
                  '<td class="n">' + (a.totalCalls || 0) + '</td><td class="n">' + escapeHTML(a.wDays || '–') + '</td>';
          };
      } else if (sec.k === 'drop') {
          var topR = Math.max(GENESYS_DROP_RATE * 300, list.reduce(function(m, a) { return Math.max(m, (a.dropRate || 0) * 100); }, 0) * 1.1);
          head = ['Agent', 'Rang out', 'Calls missed', 'Answered'];
          cells = function(a, i) {
              return '<td class="rf-v"><span class="rf-num">' + pct(a.dropRate || 0) + '</span>' + rfMeter((a.dropRate || 0) * 100, GENESYS_DROP_RATE * 100, topR, 'over', i) + '</td>' +
                  '<td class="n">' + (a.noAnswer || 0) + '</td><td class="n">' + (a.answered || 0) + '</td>';
          };
      } else if (sec.k === 'short') {
          var med = g.medianTalk || 0, cut = g.shortTalkCutoff || 0;
          head = ['Agent', 'Avg talk', 'of median', 'Shortest call', 'Handled'];
          cells = function(a, i) {
              return '<td class="rf-v"><span class="rf-num">' + fmtSecsShort(a.avgTalk) + '</span>' + rfMeter(a.avgTalk || 0, cut, med || 1, 'under', i) + '</td>' +
                  '<td class="n">' + (med ? Math.round((a.avgTalk || 0) / med * 100) + '%' : '–') + '</td><td class="n">' + fmtSecsShort(a.minTalk) + '</td><td class="n">' + (a.handled || 0) + '</td>';
          };
      } else {
          var th = cad.threshold || 30;
          var topD = Math.max(90, list.reduce(function(m, f) { return Math.max(m, f.daysSince || 0); }, 0));
          head = ['Agent', 'Since last session', 'Last session', 'Sessions (90 days)'];
          cells = function(f, i) {
              var never = f.daysSince == null;
              return '<td class="rf-v"><span class="rf-num">' + (never ? 'never' : f.daysSince + 'd') + '</span>' + rfMeter(never ? topD : f.daysSince, th, topD, 'over', i) + '</td>' +
                  '<td class="n">' + (f.lastCoachingDate ? escapeHTML(f.lastCoachingDate) : '–') + '</td><td class="n">' + (f.coachingCount90d || 0) + '</td>';
          };
      }
      var canDismiss = sec.src !== 'coach';
      var rows = list.map(function(a, i) {
          if (!a) return '';
          var nm = escapeHTML(a.name || 'Unknown'), js = nm.replace(/'/g, "\\'");
          var others = (also[a.name] || []).filter(function(s) { return s !== sec.short; });
          var tags = others.slice(0, 2).map(function(s) { return '<span class="rf-tag">' + s + '</span>'; }).join('') + (others.length > 2 ? '<span class="rf-tag">+' + (others.length - 2) + '</span>' : '');
          return '<tr' + (i < 24 ? ' class="rf-rise" style="--i:' + i + ';"' : '') + '><td class="rf-name"><span class="rf-nm">' + nm + '</span>' +
              (a.region === 'Offshore' ? '<span class="rf-tag off">Offshore</span>' : '') +
              (others.length ? '<span class="rf-also" title="Also flagged: ' + others.join(', ') + '">' + tags + '</span>' : '') + '</td>' +
              cells(a, i) +
              (canDismiss ? '<td class="rf-act"><button class="rf-x" title="Dismiss — hide from all future Red Flag reports" aria-label="Dismiss ' + nm + '" onclick="dismissFlagAgent(\'' + js + '\')"><i data-lucide="eye-off" width="14"></i></button></td>' : '') + '</tr>';
      }).join('');
      return '<div class="mv-table-wrap"><table class="mv-table rf-table"><thead><tr>' + head.map(function(h, i) { return '<th' + (i > 1 ? ' class="n"' : '') + '>' + h + '</th>'; }).join('') + (canDismiss ? '<th class="rf-act"></th>' : '') + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  // Plain-language findings across the lists (same idea as mgmtInsights).
  function rfInsights(d, also) {
      var out = [], g = d.genesys || {}, cad = state.coachingCadence || {};
      var multi = Object.keys(also).filter(function(n) { return also[n].length > 1; }).sort(function(a, b) { return also[b].length - also[a].length; });
      if (!d.usingMasterList) out.push({ tone: 'bad', icon: 'users', html: '<b>Master roster missing</b> — managers and team leads can appear in these lists until it is synced.' });
      if (multi.length) out.push({ tone: 'bad', icon: 'layers', html: '<b>' + escapeHTML(multi[0]) + '</b> is on ' + also[multi[0]].length + ' lists (' + also[multi[0]].join(', ') + ')' + (multi.length > 1 ? '; ' + (multi.length - 1) + ' more agent' + (multi.length > 2 ? 's are' : ' is') + ' on two or more.' : '.') });
      var inb = d.inbound || [], worse = inb.filter(function(a) { return a.prevIn != null && a.trendIn > 0.0005; });
      if (inb.length) {
          var big = worse.slice().sort(function(a, b) { return b.trendIn - a.trendIn; })[0];
          out.push({ tone: worse.length ? 'bad' : 'good', icon: worse.length ? 'arrow-up-right' : 'arrow-down-right', html: '<b>' + worse.length + ' of ' + inb.length + '</b> inbound flags got more inbound-heavy than last month' + (big ? ' (most: ' + escapeHTML(big.name) + ', +' + (big.trendIn * 100).toFixed(1) + ' pts).' : '.') });
      }
      var low = (d.cph || [])[0];
      if (low) out.push({ tone: 'bad', icon: 'trending-down', html: 'Lowest CP/H: <b>' + escapeHTML(low.name) + ' ' + (low.cph || 0).toFixed(2) + '</b>' + (low.prevCph != null && low.trendCph ? ', ' + (low.trendCph < 0 ? 'down ' : 'up ') + Math.abs(low.trendCph).toFixed(2) + ' on last month.' : '.') });
      var dr = g.has && (g.noAnswer || [])[0];
      if (dr) out.push({ tone: 'bad', icon: 'phone-missed', html: 'Highest ring-out rate: <b>' + escapeHTML(dr.name) + ' ' + ((dr.dropRate || 0) * 100).toFixed(1) + '%</b> — ' + (dr.noAnswer || 0) + ' calls rang out against ' + (dr.answered || 0) + ' answered.' });
      var fl = cad.flags || [];

          var never = fl.filter(function(f) { return f.daysSince == null; }).length, longest = fl.filter(function(f) { return f.daysSince != null; })[0];
          out.push({ tone: 'info', icon: 'calendar-x', html: (never ? '<b>' + never + '</b> agent' + (never === 1 ? ' has' : 's have') + ' no coaching on record' : 'Everyone has a coaching session on record') + (longest ? '; longest gap <b>' + longest.daysSince + ' days</b> (' + escapeHTML(longest.name) + ').' : '.') });
      }
      return out.slice(0, 6);
  }

  function renderAnalyzer() {
      var gemModal = mdlShell('gem-modal', 'bar-chart-2', 'Import GEM data', 'Paste the raw text of the “PA Call Performance by Agent” Excel file. The month is detected automatically and logged to the history.',
          '<textarea id="gem-import-text" class="input-aether mdl-paste custom-scrollbar" placeholder="Paste here (Ctrl+V)…"></textarea>',

      var d0 = state.analyzerData;
      var hasData = d0 && !d0.error;
      var actions = '<button class="mv-text-btn" onclick="openRfModal(\'master-modal\')"><i data-lucide="users" width="14"></i> Sync roster</button>' +
          '<button class="mv-text-btn rf-primary" onclick="openRfModal(\'gem-modal\')"><i data-lucide="upload" width="14"></i> Import GEM</button>';
      if (!hasData && !state.analyzerLoading) {
          var errMsg = d0 ? escapeHTML(d0.error) : 'Upload your first Avaya GEM report to begin.';
          return modalsHtml + pageHeader('Red Flags', 'Agents outside the assignment, productivity and coaching rules', actions) +
              '<div class="aether-card rf-empty">' + mvEmpty('flag', 'No red flags data yet', errMsg) +
              '<div class="rf-empty-act"><button class="btn btn-primary" onclick="openRfModal(\'gem-modal\')"><i data-lucide="upload" width="16"></i> Import GEM data</button><button class="btn btn-glass" onclick="openRfModal(\'master-modal\')"><i data-lucide="users" width="16"></i> Sync master roster</button></div></div>';
      }
      var d = d0 || {};
      var months = (d.availableMonths || []).slice().sort();
      var mi = months.indexOf(d.selectedMonth);
      var monthNav = '<div class="mv-datenav">' +
          '<button class="mv-icon-btn" title="Previous month" onclick="rfStepMonth(-1)"' + (mi <= 0 ? ' disabled' : '') + '><i data-lucide="chevron-left" width="16"></i></button>' +
          '<select class="mv-date rf-month" onchange="getAnalyzerHistory(this.value)" aria-label="Month">' + months.slice().reverse().map(function(m) { return '<option value="' + escapeHTML(m) + '"' + (d.selectedMonth === m ? ' selected' : '') + '>' + escapeHTML(rfMonthLabel(m)) + '</option>'; }).join('') + '</select>' +
          '<button class="mv-icon-btn" title="Next month" onclick="rfStepMonth(1)"' + (mi < 0 || mi >= months.length - 1 ? ' disabled' : '') + '><i data-lucide="chevron-right" width="16"></i></button></div>';
      var g = d.genesys || {};
      var focus = state.rfFocus || 'all';
      var segItems = [['all', 'All'], ['gem', 'GEM']].concat(g.has ? [['genesys', 'Genesys']] : []).concat([['coach', 'Coaching']]);
      if (!segItems.some(function(s) { return s[0] === focus; })) focus = 'all';
      var controls = segControl(segItems, focus, 'setRfFocus') + monthNav +
          searchBox('rf-search', 'Search agent…', escapeHTML(state.rfSearch || ''), 'handleRfSearch(this.value)', 'width:190px;', 'height:36px; border-radius:11px;') + actions;
      var roster = d.usingMasterList
          ? '<span class="rf-roster ok"><i data-lucide="shield-check" width="13"></i>Master roster applied</span>'
          : '<button class="rf-roster bad" onclick="openRfModal(\'master-modal\')"><i data-lucide="alert-circle" width="13"></i>Master roster missing — sync it</button>';
      var sub = '<b>' + escapeHTML(rfMonthLabel(d.selectedMonth) || 'Latest') + '</b> · Avaya GEM' + (g.has ? ' and Genesys' : '') + ' · ' + roster;
      var headerHtml = pageHeader('Red Flags', sub, controls);
      if (state.analyzerLoading) return modalsHtml + headerHtml + skeletonPage('Analyzing… <span>cross-referencing GEM with the master roster</span>');

      // Which lists each agent is on — used for the "also on" tags and findings.
      var also = {}, total = 0;
      RF_SECTIONS.forEach(function(sec) {
          rfSectionList(sec, d).forEach(function(a) { if (!a || !a.name) return; if (!also[a.name]) { also[a.name] = []; total++; } if (also[a.name].indexOf(sec.short) === -1) also[a.name].push(sec.short); });

  // ── Intraday IDP heatmap ────────────────────────────────────────────────────

  var MGMT_KPI_KEYS = ['sl', 'shrink', 'ot', 'absence', 'otcov', 'idp', 'coaching', 'coded', 'slchart', 'idpchart', 'otchart', 'shrinkchart', 'abschart', 'abstypes', 'forecast', 'activity', 'alarms', 'safeagents', 'offline', 'iex'];

  // ── SINGLE SOURCE OF TRUTH for trackers ─────────────────────────────────────
  // Both the Tracker tab dropdown AND the Management View embed picker read this
  // list. Add a tracker here once and it shows up in both — no other wiring.
  // `embeddable` trackers can be dropped into the Management View as a card;
  // `fetch` picks the backend (workforce trackers just pass their id as mode).

  // translated to the tracker's own mode vocabulary by mgmtGrainToTrackerMode.

  var TRACKERS = [
      { id: 'furlough', label: 'Furlough Tracker', color: '#0ea5e9', embeddable: true, fetch: 'workforce', region: 'Onshore' },
      { id: 'coaching', label: 'Coaching Tracker', color: '#f59e0b', embeddable: true, fetch: 'workforce', region: 'All' },

      { id: 'absences', label: 'Absence Tracker',  color: '#ef4444', embeddable: false },
      { id: 'training', label: 'Training Tracker', color: '#a78bfa', embeddable: false }

  function trackerById(id) { for (var i = 0; i < TRACKERS.length; i++) { if (TRACKERS[i].id === id) return TRACKERS[i]; } return null; }

  // The Management grain buttons (day/week/month/quarter/ytd) and the trackers'

  // Sun–Sat, which the trackers call 'week_sun' — plain 'week' there is the
  // Wed→Wed operational week. Everything else passes straight through.
  function mgmtGrainToTrackerMode(g) { return g === 'week' ? 'week_sun' : (g || 'week_sun'); }
  function fetchMgmtEmbed(type) {
      var t = trackerById(type);
      if (typeof google === 'undefined' || !t || !t.embeddable) return;
      var ref = state.mgmtDate;
      var mode = mgmtGrainToTrackerMode(state.mgmtGrain);
      // The grain HAS to be in the key: switching Weekly→Monthly leaves mgmtDate
      // untouched, so without it the early return below would serve the stale
      // weekly payload and the card would never move off the week.
      var key = type + '|' + ref + '|' + mode;
      var E = state.mgmtEmbed;
      if (E.key[type] === key && E.data[type] && !E.data[type].error) return;
      E.key[type] = key; E.loading[type] = true;

      else if (t.fetch === 'safe') r.getSafeAnalytics(mode, ref, t.region || 'All', 'ALL');

  }

  // Embedded real-tracker cards: a compact-but-genuine summary of each tracker's

  // Charts for embedded trackers. On a month/quarter/YTD grain a single doughnut
  // of period totals reads as one undifferentiated ring, so when the backend
  // hands us a month-over-month `trend` we draw that instead — with the months
  // the selected period actually spans (`periodKeys`) highlighted. Trackers with
  // no top-level trend (Overtime, SAFE) keep the shift-split doughnut.
  function buildMgmtEmbedCharts() {

      var L = getMgmtLayout();

      var ff = "'Outfit', sans-serif";

      var wantsTrend = (grain === 'month' || grain === 'quarter' || grain === 'ytd');
      Object.keys(charts).forEach(function(k) { if (k.indexOf('mgmtEmbed_') === 0 && charts[k]) { charts[k].destroy(); charts[k] = null; } });
      (L.embeds || []).forEach(function(type) {
          var data = state.mgmtEmbed.data[type];
          if (!data || data.error) return;
          var el = document.getElementById('mgmt-embed-' + type); if (!el) return;
          var key = 'mgmtEmbed_' + type;
          var e = trackerById(type) || {};

                  type: 'bar',
                  data: { labels: trend.map(function(m) { return m.label; }),
                          datasets: [{ label: 'Hours',

                                       backgroundColor: trend.map(function(m) { return inPeriod.indexOf(m.key) !== -1 ? tColor : (t.isDark ? 'rgba(255,255,255,0.13)' : 'rgba(15,23,42,0.10)'); }),
                                       borderRadius: 5, borderSkipped: false, maxBarThickness: 26 }] },
                  options: { responsive: true, maintainAspectRatio: false,
                      plugins: { legend: { display: false },
                          tooltip: { backgroundColor: t.isDark ? 'rgba(15,23,42,0.96)' : 'rgba(255,255,255,0.98)', titleColor: t.isDark ? '#e2e8f0' : '#0f172a', bodyColor: t.isDark ? '#cbd5e1' : '#334155', borderColor: t.isDark ? 'rgba(255,255,255,0.14)' : 'rgba(15,23,42,0.12)', borderWidth: 1, padding: 12, cornerRadius: 10,
                              callbacks: { label: function(c2) { var m = trend[c2.dataIndex] || {}; var sel = inPeriod.indexOf(m.key) !== -1 ? ' · selected' : ''; return ' ' + (Math.round((c2.parsed.y || 0) * 10) / 10) + 'h' + sel; },
                                           afterBody: function(items) { var m = trend[items[0].dataIndex] || {}; return (m.weekA != null && m.weekB != null) ? ['Week A ' + (Math.round(m.weekA * 10) / 10) + 'h · Week B ' + (Math.round(m.weekB * 10) / 10) + 'h'] : []; } } } },
                      scales: { x: { grid: { display: false }, ticks: { color: t.textColor, font: { family: ff, weight: '700', size: 10 } } },
                                y: { beginAtZero: true, grid: { color: t.gridColor }, ticks: { color: t.textColor, font: { family: ff, weight: '700', size: 10 }, callback: function(v) { return v + 'h'; } } } },
                      animation: { duration: 500 } }
              });

              plugins: { legend: { display: true, position: 'bottom', labels: { usePointStyle: true, boxWidth: 9, boxHeight: 9, padding: 12, font: { family: ff, weight: '700', size: 11 }, color: t.textColor } },
                  tooltip: { backgroundColor: t.isDark ? 'rgba(15,23,42,0.96)' : 'rgba(255,255,255,0.98)', titleColor: t.isDark ? '#e2e8f0' : '#0f172a', bodyColor: t.isDark ? '#cbd5e1' : '#334155', borderColor: t.isDark ? 'rgba(255,255,255,0.14)' : 'rgba(15,23,42,0.12)', borderWidth: 1, padding: 12, cornerRadius: 10, usePointStyle: true, callbacks: { label: function(c2) { var v = c2.parsed || 0; var pct = sum > 0 ? Math.round(v / sum * 100) : 0; return ' ' + c2.label + ': ' + (Math.round(v * 10) / 10) + 'h (' + pct + '%)'; } } } },
              animation: { duration: 500 } };
          if (sum <= 0) {
              var noneLbl = 'No hours in ' + (data.label || 'this period');
              charts[key] = new Chart(el.getContext('2d'), { type: 'doughnut', data: { labels: [noneLbl], datasets: [{ data: [1], backgroundColor: [t.gridColor], borderWidth: 0 }] }, options: Object.assign({}, dOpts, { plugins: { legend: { display: false }, tooltip: { enabled: false } } }) });
          } else {
              charts[key] = new Chart(el.getContext('2d'), { type: 'doughnut', data: { labels: labels, datasets: [{ data: vals, backgroundColor: colors, borderColor: t.isDark ? '#0f172a' : '#fff', borderWidth: 2 }] }, options: dOpts });
          }
      });
  }

  function mgmtCodingCard() {

      var hms = function(h) { var t = Math.round((h || 0) * 3600), hh = Math.floor(t / 3600), mm = Math.floor((t % 3600) / 60), ss = t % 60; return hh + ':' + ('0' + mm).slice(-2) + ':' + ('0' + ss).slice(-2); };

  // ───────────────────────── MANAGEMENT VIEW ─────────────────────────────────
  // Reading order: four headline numbers (with their trend), plain-language
  // "what changed" lines, secondary tiles, then one chart per question (one
  // y-axis each), then the reference tables. Colours come from MV_PAL: a
  // colour-blind-checked categorical order (validated with the dataviz
  // palette checker), light and dark steps. Text is always ink, never series
  // colour; good/bad reads from the status tokens plus an arrow/icon.
  var MV_PAL = {
      light: { s1: '#2a78d6', s2: '#eb6834', s3: '#1baf7a', s4: '#eda100', s5: '#e87ba4', s7: '#6250d6', good: '#0ca30c', bad: '#d03b3b', neutral: 'rgba(15,23,42,0.16)' },
      dark:  { s1: '#3987e5', s2: '#d95926', s3: '#199e70', s4: '#c98500', s5: '#d55181', s7: '#9085e9', good: '#0ca30c', bad: '#e66767', neutral: 'rgba(255,255,255,0.18)' }
  };
  function mvPal() { return MV_PAL[document.body.classList.contains('dark') ? 'dark' : 'light']; }
  var MV_SHIFTS = [{ k: 'Night', slot: 's1', hrs: '23–07' }, { k: 'Morning', slot: 's3', hrs: '07–15' }, { k: 'Evening', slot: 's2', hrs: '15–23' }];
  var MV_GRAINS = [['day', 'Day'], ['week', 'Week'], ['month', 'Month'], ['quarter', 'Quarter'], ['ytd', 'YTD']];

  function mgmtSlTarget() { var t = parseFloat(getMgmtLayout().slTarget); return isFinite(t) && t > 0 && t <= 100 ? t : 80; }
  window.setMgmtSlTarget = function() {
      var v = prompt('Service level target (%)', String(mgmtSlTarget()));
      if (v == null) return;
      var n = parseFloat(v); if (!isFinite(n) || n <= 0 || n > 100) return;
      getMgmtLayout().slTarget = n; saveMgmtLayout(); render();
  };
  // ‹ › steps one period of the current grain; Today jumps back.
  window.mgmtStep = function(dir) {
      var p = (state.mgmtDate || localDateStr()).split('-');
      var dt = new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0);
      var g = state.mgmtGrain;
      if (g === 'day') dt.setDate(dt.getDate() + dir);
      else if (g === 'week') dt.setDate(dt.getDate() + 7 * dir);
      else if (g === 'month') { dt.setDate(1); dt.setMonth(dt.getMonth() + dir); }
      else if (g === 'quarter') { dt.setDate(1); dt.setMonth(dt.getMonth() + 3 * dir); }
      else { dt.setDate(1); dt.setFullYear(dt.getFullYear() + dir); }
      if (dir > 0 && localDateStr(dt) > localDateStr()) dt = new Date();   // never past today
      state.mgmtDate = localDateStr(dt); fetchMgmtData(); render();
  };
  window.mgmtToday = function() { state.mgmtDate = localDateStr(); fetchMgmtData(); render(); };

  // Shrinkage % for a totals object (or a bucket) with the chosen categories.
  function mgmtShrinkPct(t) {
      if (!t || !(t.schedH > 0)) return null;
      var num = MGMT_SHRINK_CATS.reduce(function(s, c) { return s + (state.mgmtShrinkCats[c.k] ? (t[c.k] || 0) : 0); }, 0);
      return Math.round((num / t.schedH) * 1000) / 10;
  }
  function mgmtAbsPct(t) { return t && t.schedH > 0 ? Math.round(((t.absHours || 0) / t.schedH) * 1000) / 10 : null; }

  // Bucket label → a name that stands alone in a sentence ("Tue 27", "Oct 12", "14:00").
  function mgmtBucketName(d, i) {
      var b = (d.buckets || [])[i]; if (!b) return '';
      if (d.grain === 'day') return b.label.replace(/h$/, ':00');
      if (d.grain === 'month' && d.sel && d.sel.startStr) {
          var p = d.sel.startStr.split('-');
          return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString('en-US', { month: 'short' }) + ' ' + b.label;
      }
      return b.label;
  }

  // Delta chip: arrow + amount (+%), green when the move is good.
  function mgmtDelta(d, curV, prevV, goodWhenUp, suffix) {
      if (curV == null || prevV == null) return '';
      var word = ({ day: 'day', week: 'week', month: 'month', quarter: 'quarter', ytd: 'year' })[d.grain] || 'period';
      var vsTxt = 'vs last ' + word + (d.compare && d.compare.toDate ? ' to date' : '');
      var diff = Math.round((curV - prevV) * 10) / 10;
      if (diff === 0) return '<span class="mgmt-delta flat">= ' + vsTxt + '</span>';
      var up = diff > 0, good = up === !!goodWhenUp;
      var pts = suffix === ' pts';
      var pct = (!pts && prevV) ? Math.round(Math.abs(diff) / Math.abs(prevV) * 100) : null;
      return '<span class="mgmt-delta ' + (good ? 'good' : 'bad') + '">' + (up ? '▲' : '▼') + ' ' + Math.abs(diff) + (suffix || '') + (pct != null && isFinite(pct) ? ' (' + (up ? '+' : '−') + pct + '%)' : '') + ' <span class="vs">' + vsTxt + '</span></span>';
  }

  // Inline SVG sparkline. Gaps (null) break the line instead of inventing
  // values. Optional dashed reference line (e.g. the SL target).
  function mvSpark(vals, ref) {
      var pts = []; vals.forEach(function(v, i) { if (v != null && isFinite(v)) pts.push([i, v]); });
      if (pts.length < 2) return '<div class="mv-spark-none">not enough points for a trend</div>';
      var W = 200, H = 40, n = Math.max(1, vals.length - 1);
      var ys = pts.map(function(p) { return p[1]; }); if (ref != null) ys.push(ref);
      var lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
      if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
      var pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
      var X = function(i) { return (i / n * W).toFixed(1); }, Y = function(v) { return (H - (v - lo) / (hi - lo) * H).toFixed(1); };
      var line = '', area = '', prev = -2, segStart = null;
      pts.forEach(function(p, k) {
          var cont = p[0] === prev + 1;
          line += (cont ? ' L' : ' M') + X(p[0]) + ' ' + Y(p[1]);
          prev = p[0];
      });
      var first = pts[0], last = pts[pts.length - 1];
      area = 'M' + X(first[0]) + ' ' + H + line.replace(/^ M/, ' L') + ' L' + X(last[0]) + ' ' + H + ' Z';
      var refLine = ref != null ? '<line class="r" x1="0" x2="' + W + '" y1="' + Y(ref) + '" y2="' + Y(ref) + '"/>' : '';
      return '<svg class="mv-spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true"><path class="a" d="' + area + '"/>' + refLine + '<path class="l" d="' + line.trim() + '"/></svg>';
  }

  // Plain-language reading of the period: the few things a manager would
  // otherwise dig through the charts for. Each line names its evidence.
  function mgmtInsights(d) {
      var cur = (d.totals || {}).sel || {}, prev = (d.totals || {}).prev || {};
      var B = d.buckets || [], A = d.abs || [];
      var out = [], target = mgmtSlTarget(), unit = d.grain === 'day' ? 'hours' : (d.grain === 'quarter' || d.grain === 'ytd' ? 'months' : 'days');
      var r1 = function(v) { return Math.round(v * 10) / 10; };
      // Service level against target.
      var slIdx = []; B.forEach(function(b, i) { if (b.slAvg != null) slIdx.push(i); });
      if (slIdx.length) {
          var below = slIdx.filter(function(i) { return B[i].slAvg < target; });
          var worst = slIdx.reduce(function(w, i) { return B[i].slAvg < B[w].slAvg ? i : w; }, slIdx[0]);
          if (below.length) out.push({ tone: 'bad', icon: 'trending-down', html: 'Service level under the ' + target + '% target on <b>' + below.length + ' of ' + slIdx.length + '</b> ' + unit + ' with readings — lowest <b>' + escapeHTML(mgmtBucketName(d, worst)) + '</b> at <b>' + B[worst].slAvg + '%</b>' + (B[worst].ackAvg != null ? ' (ACK ' + B[worst].ackAvg + 's)' : '') + '.' });
          else out.push({ tone: 'good', icon: 'check', html: 'Service level at or above the ' + target + '% target on all <b>' + slIdx.length + '</b> ' + unit + ' with readings.' });
      }
      // Staffing: the worst average gap.
      var gapIdx = []; B.forEach(function(b, i) { if (b.idpReq != null && b.idpOpen != null) gapIdx.push(i); });
      if (gapIdx.length) {
          var g = gapIdx.reduce(function(w, i) { return (B[i].idpOpen - B[i].idpReq) < (B[w].idpOpen - B[w].idpReq) ? i : w; }, gapIdx[0]);
          var net = r1(B[g].idpOpen - B[g].idpReq);
          if (net < -0.5) out.push({ tone: 'bad', icon: 'users', html: 'Biggest staffing gap: <b>' + escapeHTML(mgmtBucketName(d, g)) + '</b>, <b>' + Math.abs(net) + ' seats short</b> on average (needed ' + r1(B[g].idpReq) + ', had ' + r1(B[g].idpOpen) + ').' });
          else out.push({ tone: 'good', icon: 'users', html: 'Staffed to requirement every ' + unit.replace(/s$/, '') + ' — the tightest was ' + escapeHTML(mgmtBucketName(d, g)) + ' at ' + (net >= 0 ? '+' : '') + net + ' seats.' });
      }
      // Absence: which shift carries it, and the leading type.
      var sh = cur.absShift || {}, shT = (sh.Night || 0) + (sh.Morning || 0) + (sh.Evening || 0);
      if (shT > 0) {
          var top = MV_SHIFTS.slice().sort(function(a, b) { return (sh[b.k] || 0) - (sh[a.k] || 0); })[0];
          var share = Math.round((sh[top.k] || 0) / shT * 100);
          var types = Object.keys(cur.absTypes || {}).sort(function(a, b) { return cur.absTypes[b] - cur.absTypes[a]; });
          var tt = types[0], off = tt ? ((cur.absTypesOff || {})[tt] || 0) : 0;

  // ──────────────────── ACK POINT OF NO RETURN (calculator) ────────────────────
  // Fully automatic: after a calculation, the BURG count / BURG ACK /
  // snapshot time parsed from the paste produce the verdict with zero
  // typing — shown as a slim banner, not a form. A "What-if" toggle
  // exposes the manual fields for scenario testing only.
  // Math (validated against the "Point of no return" sheet):
  //   remaining  = (alarms ÷ hoursElapsed) × (24 − hoursElapsed)
  //   required   = (target×(alarms+remaining) − currentACK×alarms) ÷ remaining
  //   floor      = best achievable day-end ACK if the rest are instant
  function computePonr(ack, alarms, t, target) {
      if (!(ack >= 0) || !(alarms > 0) || !(t > 0) || t >= 24 || !(target > 0)) return null;
      var remaining = (alarms / t) * (24 - t);
      var required = (target * (alarms + remaining) - ack * alarms) / remaining;
      var floor = (ack * alarms) / (alarms + remaining);
      return { remaining: remaining, required: required, floor: floor };
  }
  function ponrTarget() {
      var v = 30;
      try { v = parseFloat(localStorage.getItem('ponr_target')) || 30; } catch(e) {}
      return v;
  }
  window.setPonrTarget = function(v) {

      render();
  };
  window.togglePonrWhatIf = function() { state.ponrWhatIf = !state.ponrWhatIf; render(); };

  window.updatePonr = function() {
      var box = document.getElementById('ponr-result');
      if (!box) return;
      var num = function(id) { var el = document.getElementById(id); return el ? parseFloat(el.value) : NaN; };
      var target = num('ponr-target');
      if (target > 0) { try { localStorage.setItem('ponr_target', String(target)); } catch(e) {} }
      var r = computePonr(num('ponr-ack'), num('ponr-alarms'), num('ponr-time'), target);
      if (!r) {
          box.innerHTML = '<div style="padding:16px; color:var(--text-muted); font-size:0.85rem; font-weight:600;">Enter current ACK, BURG alarms received, and the time (e.g. 16.25 = 4:15 PM) to project the rest of the day.</div>';
          return;
      }
      box.innerHTML = ponrVerdictHtml(r, target, true);
      refreshIcons();
  };
  window.ponrSetNow = function() {
      var el = document.getElementById('ponr-time');
      if (!el) return;
      var n = new Date();
      el.value = (n.getHours() + Math.floor(n.getMinutes() / 15) * 0.25).toFixed(2);
      updatePonr();
  };

  function ponrVerdictHtml(r, target, withStats) {
      // `target` is really the upper STRESS LIMIT (e.g. 30s): at or above it we
      // can't release furlough / off-queue. It is NOT a goal to reach. `required`
      // = the average ACK the REST of the day can run before the day-end ACK
      // crosses that limit.
      var verdict = function(tone, icon, head, txt) {
          return '<div class="cx-verdict ' + tone + '"><span class="ic"><i data-lucide="' + icon + '" width="16"></i></span><div><b>' + head + '</b> — ' + txt + '</div></div>';
      };
      var reqTxt = r.required > 600 ? 'far above the limit' : ('≈ ' + r.required.toFixed(1) + 's');
      var banner;
      if (r.floor > target || r.required < 0) {
          banner = verdict('bad', 'alert-octagon', 'Over the ' + target + 's limit', 'even instant ACKs land the day at ' + r.floor.toFixed(1) + 's. At or above ' + target + 's, furlough &amp; off-queue come off the table.');
      } else if (r.required < target) {
          // Must run TIGHTER than the limit for the rest of the day to stay under.
          var warn = r.required < target * 0.6;
          banner = verdict(warn ? 'warn' : 'good', warn ? 'alert-triangle' : 'check-circle', warn ? 'Tight' : 'On track',
              'keep the rest of the day averaging ≤ ' + r.required.toFixed(1) + 's to finish under the ' + target + 's limit.');
      } else {
          // required ≥ limit → comfortable headroom.
          banner = verdict('good', 'check-circle', 'Comfortable', 'well under the ' + target + 's limit. The rest of the day would have to average ' + reqTxt + ' to breach it.');
      }
      if (!withStats) return banner;
      var stat = function(label, value, note) { return '<div class="cx-stat"><span class="k">' + label + '</span><b>' + value + '</b>' + (note ? '<small>' + note + '</small>' : '') + '</div>'; };
      return '<div class="cx-stats cx-stats-3">' +
          stat('Remaining alarms (projected)', Math.round(r.remaining * 100) / 100) +
          stat('Breach threshold', r.required < 0 ? 'past' : (r.required > 600 ? '>600s' : r.required.toFixed(1) + 's'), 'rest-of-day average') +
          stat('Best possible day-end', r.floor.toFixed(1) + 's', r.floor > target ? 'over the limit' : 'if the rest were instant') +
          '</div>' + banner;
  }

  function calcHourLabel(h) {
      if (h == null || !isFinite(h)) return '';
      var hh = Math.floor(h), mm = Math.round((h - hh) * 60);
      return ((hh % 12) || 12) + ':' + (mm < 10 ? '0' : '') + mm + (hh < 12 ? ' AM' : ' PM');
  }

          var timePre = auto ? lc.updateHour.toFixed(2) : (n.getHours() + Math.floor(n.getMinutes() / 15) * 0.25).toFixed(2);
          var input = function(id, label, value, placeholder, extra) {
              return '<label class="cx-field"><span>' + label + '</span><span class="cx-in">' +
                     '<input id="' + id + '" type="number" step="any" class="input-aether" value="' + value + '" placeholder="' + placeholder + '" oninput="updatePonr()">' + (extra || '') + '</span></label>';

              '<div class="cx-ponr-h">' + title + '<span class="cx-pill">What-if</span><span style="flex:1;"></span><button class="mv-text-btn" onclick="togglePonrWhatIf()"><i data-lucide="corner-up-left" width="14"></i> Back to automatic</button></div>' +
              '<div class="cx-fields">' +

              input('ponr-time', 'Time (decimal hours)', timePre, '16.25', '<button class="mv-text-btn" onclick="event.preventDefault(); ponrSetNow()" title="Set to the current quarter-hour">Now</button>') +
              input('ponr-target', 'Stress limit (s)', target, '30') +
              '</div><div id="ponr-result"></div></div>';
      }

      var headRight = '<span class="cx-limit"><label title="Upper stress limit — at/above this we can\'t release furlough or off-queue. Not a goal to hit.">Limit</label>' +
          '<input type="number" step="any" class="input-aether" value="' + target + '" onchange="setPonrTarget(this.value)"><span>s</span></span>' +
          '<button class="mv-text-btn" onclick="togglePonrWhatIf()"><i data-lucide="flask-conical" width="14"></i> What-if</button>';

      if (!auto) {
          return '<div class="aether-card cx-ponr cx-ponr-idle"><div class="cx-ponr-h">' + title +
              '<span class="cx-ponr-hint">checked automatically when you run a calculation</span><span style="flex:1;"></span>' + headRight + '</div></div>';
      }

      var r = computePonr(lc.burgAckSec, lc.burgActual, lc.updateHour, target);
      var detail = '<div class="cx-ponr-d">From your paste: <b>' + Number(lc.burgActual).toLocaleString() + '</b> BURG alarms · ACK <b>' + lc.burgAckSec + 's</b> · snapshot at <b>' + calcHourLabel(lc.updateHour) + '</b>' +
          (r ? ' · projected remaining <b>' + Math.round(r.remaining) + '</b>' : '') + '</div>';
      return '<div class="aether-card cx-ponr">' +
          '<div class="cx-ponr-h">' + title + '<span class="cx-pill">Auto</span><span style="flex:1;"></span>' + headRight + '</div>' +
          (r ? ponrVerdictHtml(r, target, false) : '<div class="cx-ponr-d">Not enough data in the paste to project (needs BURG volume and a valid snapshot time).</div>') +
          detail + '</div>';
  }

  // Report preview: the exact text, with the section headers in bold so the
  // preview reads like the pasted result. Copy buttons use the raw text.
  function calcReportPreview(text) {
      return String(text).split('\n').map(function(line) {
          var h = calcHeaderSplit(line);
          return h ? '<b>' + calcEsc(h.head) + '</b>' + calcEsc(h.rest) : calcEsc(line);
      }).join('\n');
  }

  function renderCalc() {
     if(!state.calcLibLoaded) fetchCalcTemplate();
     var lc = state.lastCalc && state.lastCalc.svl ? state.lastCalc : null;
     var sl = String(state.currentSL || '').trim(), hasSl = !/^-+$|^$/.test(sl);
     var slNum = parseFloat(sl), target = mgmtSlTarget(), limit = ponrTarget();
     var sub = lc && lc.updateHour != null ? 'last run on the <b>' + calcHourLabel(lc.updateHour) + '</b> snapshot<span class="mv-cmp">template: ' + escapeHTML(state.calcActive || 'Default') + '</span>'
             : 'paste the Genesys and MAS pages, run the analysis, then copy the report';
     var header = pageHeader('Calculator', sub, '');

     var paste = '<div class="aether-card cx-paste">' +
        '<div class="mv-sec-h">Stats paste<span>inbound from Genesys Cloud · outbound from MAS</span></div>' +
        '<label class="paste-label" for="in-text"><i data-lucide="phone-incoming" width="13"></i> Inbound — Genesys Cloud (External ASA / SL / LCW)</label>' +
        '<textarea id="in-text" class="paste-zone custom-scrollbar" placeholder="Paste the Genesys widgets here…" oninput="state.calcIn=this.value">' + escapeHTML(state.calcIn || '') + '</textarea>' +
        '<label class="paste-label" for="out-text"><i data-lucide="phone-outgoing" width="13"></i> Outbound — Alarm Resp Time</label>' +

        '<button class="btn btn-primary cx-run" onclick="runCalculation()"' + (state.calcRunning ? ' disabled' : '') + '><i data-lucide="' + (state.calcRunning ? 'loader' : 'play') + '" width="16"></i> ' + (state.calcRunning ? 'Calculating…' : 'Run analysis') + '</button></div>';

     var badge = hasSl && isFinite(slNum) ? (slNum >= target ? mvBadge('good', 'check', 'On target') : mvBadge('bad', 'arrow-down-right', 'Below target')) : '';
     var pct = hasSl && isFinite(slNum) ? Math.max(0, Math.min(100, slNum)) : 0;
     var resultTop = (hasSl ? '<div class="cx-big"><span class="cnum">' + escapeHTML(sl) + '</span></div>' : '<div class="cx-big cx-dash">No run yet</div><div class="cx-none">Paste both pages on the left and run the analysis</div>') +
         '<div class="cx-gauge"><div class="cx-track">' + (pct ? '<i style="width:' + pct + '%;"></i>' : '') + '<span class="cx-tick" style="left:' + target + '%;"></span></div>' +
         '<div class="cx-scale"><span>0%</span><span class="tg" style="left:' + target + '%;">target ' + target + '%</span><span>100%</span></div></div>';
     // Breakdown: the run's other figures (an empty frame until the first run).
     var L = lc || {};
     var ackN = parseFloat(L.ack);
     var ackNote = isFinite(ackN) ? (ackN >= limit ? '<em class="bad">over the ' + limit + 's limit</em>' : 'under the ' + limit + 's limit') : '';
     var st = function(k, v, note) { return '<div class="cx-stat"><span class="k">' + k + '</span><b>' + escapeHTML(v == null || v === '' ? '—' : String(v)) + '</b>' + (note ? '<small>' + note + '</small>' : '') + '</div>'; };
     resultTop += '<div class="cx-stats' + (lc ? '' : ' empty') + '">' +
         st('SVL in', L.inSVL, lc ? 'Genesys' : '') + st('ACK', L.ack, ackNote) + st('ASA', L.asa) + st('LCW interval', L.lcw) +
         st('Trend out', L.trendOut, lc ? 'last 60 min' : '') + st('Trend in', L.trendIn) + st('SAFE', L.safe) +
         st('BURG ACK', L.burgAckSec != null && L.burgActual ? L.burgAckSec + 's' : '', L.burgActual ? Number(L.burgActual).toLocaleString() + ' alarms' : '') + '</div>';
     var hasReport = state.currentReport && state.currentReport !== '...';
     var result = '<div class="aether-card cx-result">' +
        '<div class="mv-k">Projected SVL out' + badge + '</div>' + resultTop +
        '<div class="cx-rep-h">Report<span>' + escapeHTML(state.calcActive || 'Default') + ' template</span></div>' +
        '<div id="report-box"><div class="cx-report custom-scrollbar" id="report-content">' + (hasReport ? calcReportPreview(state.currentReport) : '<span class="cx-ph">The report appears here after a run.</span>') + '</div>' +
        '<div class="cx-copy"><button class="mv-text-btn gx-primary"' + (hasReport ? '' : ' disabled') + ' onclick="copyReport()" title="For Google Chat: exact spacing, section headers in bold (Chat can\'t show colours)"><i data-lucide="message-square" width="14"></i> Copy for Chat</button>' +
        '<button class="mv-text-btn"' + (hasReport ? '' : ' disabled') + ' onclick="copyReportRich()" title="For Gmail / Docs: section headers in red"><i data-lucide="mail" width="14"></i> Copy Rich (email)</button></div></div></div>';

     return header + renderPonrCard() + '<div class="grid-split cx-row">' + paste + result + '</div>' + renderCalcTemplateEditor();
  }

  // Client-side token fill — mirrors buildCalcReport() in CORE/Calculator.gs so
  // the editor preview matches what the server will produce.
  function applyCalcTemplate(tpl, s) {
     var map = { svlOut: s.svl, svlIn: s.inSVL, ack: s.ack, asa: s.asa, lcw: s.lcw, safe: s.safe, trendIn: s.trendIn, trendOut: s.trendOut };
     return (tpl || "").replace(/\{(\w+)\}/g, function(m, k) { return (map[k] !== undefined && map[k] !== null) ? map[k] : m; });
  }

  function calcPreviewStats() {
     // Use the last real calculation if there is one, else representative sample values.
     var lc = state.lastCalc;
     if(lc && lc.svl) return { svl: lc.svl, inSVL: lc.inSVL, ack: lc.ack, asa: lc.asa, lcw: lc.lcw, safe: lc.safe, trendIn: lc.trendIn, trendOut: lc.trendOut };
     return { svl: "88%", inSVL: "61%", ack: "14s", asa: "10s", lcw: "13s", safe: "N/A", trendIn: "N/A", trendOut: "-2%" };
  }

  // Re-run the current paste (so the visible report updates) or re-render.
  function calcRefreshAfterChange() {
     var i = document.getElementById('in-text'); var o = document.getElementById('out-text');
     if(i && o && (i.value.trim() || o.value.trim())) runCalculation(); else render();
  }

  // Apply a library payload returned by a mutation, then refresh. Returns true on ok.
  function calcHandleLibResult(r) {
     var d = {}; try { d = JSON.parse(r); } catch(e) {}
     if(d && d.ok) { applyCalcLibrary(d); calcRefreshAfterChange(); return true; }
     showToast((d && d.error) || "Action failed");
     return false;
  }

        '<button class="mv-text-btn"' + (isDefault ? ' disabled title="The built-in Default can\'t be deleted"' : '') + ' onclick="calcDeleteTemplate()"><i data-lucide="trash-2" width="14"></i> Delete</button>' +
        '</div>';

     var editHint = isDefault
        ? 'Editing the built-in <b>Default</b>' + (state.calcDefaultCustom ? ' (customized)' : '') + ' — used whenever no named template is active. <b>Save Default</b> keeps your changes; <b>Save As New…</b> branches a named layout (e.g. "Week A - Night").'
        : 'Editing <b>' + escapeHTML(state.calcActive) + '</b>. Placeholders in braces are filled with live values; all other text is literal (add/remove "(Genesys)", flip Coaching Open/Closed, etc.).';

     showToast("Saving default…");

  // Restore the built-in Default to the original factory text.

  function sanitizeRichText(html) {
      if (!html) return '';
      var allowed = {P:1,BR:1,STRONG:1,B:1,EM:1,I:1,U:1,UL:1,OL:1,LI:1,A:1,SPAN:1,DIV:1,H1:1,H2:1,H3:1,H4:1,H5:1,H6:1,CODE:1,PRE:1,BLOCKQUOTE:1,HR:1};
      var temp = document.createElement('div');
      temp.innerHTML = String(html);

          var kids = Array.prototype.slice.call(node.childNodes);
          kids.forEach(function(child) {
              if (child.nodeType === 1) {
                  var tag = child.tagName;
                  if (tag === 'SCRIPT' || tag === 'STYLE') { node.removeChild(child); return; }
                  if (!allowed[tag]) {
                      while (child.firstChild) node.insertBefore(child.firstChild, child);
                      node.removeChild(child);
                      return;
                  }
                  Array.prototype.slice.call(child.attributes).forEach(function(attr) {
                      if (tag === 'A' && attr.name === 'href') {
                          var v = String(attr.value || '').trim();
                          if (/^(javascript|data|vbscript):/i.test(v)) child.removeAttribute('href');
                      } else {
                          child.removeAttribute(attr.name);
                      }
                  });
                  if (tag === 'A' && child.getAttribute('href')) {
                      child.setAttribute('target', '_blank');
                      child.setAttribute('rel', 'noopener noreferrer');
                      child.style.color = 'var(--accent-primary)';
                      child.style.textDecoration = 'underline';
                  }
                  walk(child);
              } else if (child.nodeType === 3) {
                  var text = child.nodeValue;
                  if (node.tagName !== 'A' && /https?:\/\//.test(text)) {
                      var frag = document.createDocumentFragment();
                      var last = 0, re = /https?:\/\/[^\s<>"']+/g, m;
                      while ((m = re.exec(text)) !== null) {
                          if (m.index > last) frag.appendChild(document.createTextNode(text.substring(last, m.index)));
                          var a = document.createElement('a');
                          a.href = m[0];
                          a.textContent = m[0];
                          a.target = '_blank';
                          a.rel = 'noopener noreferrer';
                          a.style.color = 'var(--accent-primary)';
                          a.style.textDecoration = 'underline';
                          frag.appendChild(a);
                          last = m.index + m[0].length;
                      }
                      if (last < text.length) frag.appendChild(document.createTextNode(text.substring(last)));
                      node.replaceChild(frag, child);
                  }
              } else {
                  node.removeChild(child);
              }
          });

  function initCharts() {}


  // ───────────────────────────── Data coverage ─────────────────────────────
  // Which days each imported dataset covers (imported / partial / missing /
  // not expected / already in for the future) and what needs updating. Data: getDataCoverage() (CORE/DataCoverage.gs). Lives in
  // its own overlay outside #content, so the 60s floor/tracker polls never
  // re-render it under the user. Entry: the sync chip in the Tracker and
  // Insights headers (coverageChip).
  var COV_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var cov = { range: '90', year: new Date().getFullYear(), day: null, days: null };

  function covAdd(day, n) { var p = day.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2] + n, 12); return localDateStr(d); }
  function covSunday(day) { var p = day.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2], 12); return covAdd(day, -d.getDay()); }
  function covFmt(day) { if (!day) return '—'; var p = day.split('-'); return COV_MONTHS[+p[1] - 1] + ' ' + (+p[2]); }
  function covFmtLong(day) { var p = day.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2], 12); return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()] + ', ' + COV_MONTHS[+p[1] - 1] + ' ' + (+p[2]) + ', ' + p[0]; }

  // day → { n, partial, via, p } for every grain, memoised on the dataset.
  function covExpand(ds) {
      if (ds._exp) return ds._exp;
      var m = {};
      var put = function(day, v) { if (!m[day]) m[day] = v; };
      Object.keys(ds.days || {}).forEach(function(d) { var n = ds.days[d]; m[d] = { n: n, partial: !!(ds.perDay && n < ds.perDay), via: 'day' }; });
      Object.keys(ds.weeks || {}).forEach(function(w) { for (var i = 0; i < 7; i++) put(covAdd(w, i), { n: ds.weeks[w], via: 'week', p: { s: w, e: covAdd(w, 6) } }); });
      (ds.periods || []).forEach(function(pr) { for (var d = pr.s, g = 0; d <= pr.e && g < 400; d = covAdd(d, 1), g++) put(d, { n: pr.n, via: 'period', p: pr }); });
      Object.keys(ds.months || {}).forEach(function(mk) {
          var y = +mk.substring(0, 4), mo = +mk.substring(5, 7), last = new Date(y, mo, 0).getDate();
          for (var i = 1; i <= last; i++) put(mk + '-' + (i < 10 ? '0' : '') + i, { n: ds.months[mk], via: 'month', p: { s: mk + '-01', e: mk + '-' + last } });
      });

  // Is `day` expected to have data for this dataset? (Only from its first
  // ever day — before that it simply wasn't tracked yet.)
  function covExpected(ds, day, today) {
      covExpand(ds);
      if (!ds._first || day < ds._first || ds.key === 'otopen') return false;
      switch (ds.key) {
          case 'wfm': return day <= covAdd(today, 6);              // a week of schedule ahead
          case 'idp': return day <= today;
          case 'calc': case 'forecast': return day < today;
          case 'safe': case 'genesys': case 'activity': return day < covSunday(today);   // complete weeks
          case 'gem': case 'alarms': return day < today.substring(0, 7) + '-01';        // complete months

      return day <= today;

  // { level: ok|warn|bad|none, text, missing30 }
  function covStatus(ds, today) {
      var m = covExpand(ds);
      if (!ds._first) return { level: 'none', text: 'Never imported', missing30: 0 };
      var missing30 = 0;
      for (var d = covAdd(today, -30); d <= covAdd(today, 6); d = covAdd(d, 1)) if (covExpected(ds, d, today) && !m[d]) missing30++;

      var gaps = missing30 ? ' · ' + missing30 + ' day' + (missing30 === 1 ? '' : 's') + ' missing (30d)' : '';
      switch (ds.key) {
          case 'wfm':
              if (!t) return { level: 'bad', text: 'No schedule for today', missing30: missing30 };
              if (last < covAdd(today, 6)) return { level: 'warn', text: 'Schedule ends ' + covFmt(last) + ' — paste next week', missing30: missing30 };
              break;
          case 'idp':
              if (!t) return { level: 'bad', text: "Today's IDP not imported", missing30: missing30 };
              if (t.partial) return { level: 'warn', text: 'Today ' + t.n + ' of ' + ds.perDay + ' intervals', missing30: missing30 };
              break;

              var lastH = hrs.slice().sort().pop(), lm = +lastH.substring(0, 2) * 60 + +lastH.substring(3, 5);
              if (mins - lm > 90) return { level: 'warn', text: 'Last run ' + lastH + ' (' + hrs.length + ' today)', missing30: missing30 };
              return { level: 'ok', text: hrs.length + ' run' + (hrs.length === 1 ? '' : 's') + ' today · last ' + lastH, missing30: missing30 };
          case 'otopen':
              if (last < today) return { level: 'warn', text: 'Nothing posted from today — latest ' + covFmt(last), missing30: 0 };
              return { level: 'ok', text: 'Slots through ' + covFmt(last), missing30: 0 };
          case 'gem': case 'alarms':

      }
      if (missing30) return { level: 'warn', text: 'Covers to ' + covFmt(last) + gaps, missing30: missing30 };
      return { level: 'ok', text: 'Up to date · through ' + covFmt(last), missing30: 0 };
  }

  function covRangeDays() {

      if (v) {
          if (ds.key === 'wfm') return v.n + ' agent-day' + (v.n === 1 ? '' : 's') + ' scheduled';
          if (ds.key === 'idp') return v.n + ' of ' + ds.perDay + ' intervals';
          if (ds.key === 'calc') { var h = (ds.hours && ds.hours[day]) || []; return v.n + ' run' + (v.n === 1 ? '' : 's') + (h.length ? ' · ' + h.slice().sort().join(', ') : ''); }
          if (ds.key === 'otopen') return v.n + ' slot window' + (v.n === 1 ? '' : 's');
          if (ds.key === 'forecast') return v.via === 'month' ? 'Monthly forecast' : 'Daily forecast';
          if (v.via === 'period') return 'Period ' + covFmt(v.p.s) + ' – ' + covFmt(v.p.e) + ' · ' + v.n + ' agents';
          if (v.via === 'week') return 'Week of ' + covFmt(v.p.s);
          if (v.via === 'month') return COV_MONTHS[+day.substring(5, 7) - 1] + ' ' + day.substring(0, 4) + ' monthly report';
          return v.n + ' row' + (v.n === 1 ? '' : 's');
      }
      if (covExpected(ds, day, today)) return day > today ? 'Due — not imported yet' : 'Missing';
      if (!ds._first) return 'Never imported';
      if (day < ds._first) return 'Not tracked yet';
      return day > today ? 'Not expected yet' : 'Not expected';
  }

  window.openCoverage = function() {
      if (document.getElementById('cov-overlay')) return;
      cov.day = cov.day || localDateStr(new Date());
      var ov = document.createElement('div');
      ov.id = 'cov-overlay'; ov.className = 'cov-overlay';
      ov.innerHTML = '<div class="cov-panel" role="dialog" aria-label="Data coverage" onclick="event.stopPropagation()"></div>';
      ov.addEventListener('click', closeCoverage);
      document.body.appendChild(ov);
      document.addEventListener('keydown', covKeys);
      window.addEventListener('resize', covPlaceOverlays);
      renderCoverage(true);
      fetchCoverage();   // refresh while open
  };
  window.closeCoverage = function() {
      var ov = document.getElementById('cov-overlay'); if (!ov) return;
      document.removeEventListener('keydown', covKeys);
      window.removeEventListener('resize', covPlaceOverlays);
      ov.id = ''; ov.style.pointerEvents = 'none';   // gone for interaction immediately
      var done = function() { if (ov.parentNode) ov.parentNode.removeChild(ov); };
      if (covMotion()) { gsap.to(ov, { opacity: 0, duration: 0.2, onComplete: done }); setTimeout(done, 400); }
      else done();
  };
  function covKeys(e) {
      if (e.key === 'Escape') { closeCoverage(); return; }
      var step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
      if (step && cov.day) { e.preventDefault(); covPickDay(covAdd(cov.day, step)); }
  }
  window.covSetRange = function(r) { cov.range = r; if (r === 'year') cov.year = +(cov.day || localDateStr(new Date())).substring(0, 4); renderCoverage(false, 'range'); };
  window.covSetYear = function(dy) { cov.year += dy; renderCoverage(false, 'range'); };

  // Crosshair + tooltip follow the pointer; nothing re-renders.
  function covIndexAt(clientX) {
      var strip = document.querySelector('#cov-overlay .cvm-strip'); if (!strip || !cov.days) return -1;
      var r = strip.getBoundingClientRect(), i = Math.floor((clientX - r.left) / (r.width / cov.days.length));
      return (i >= 0 && i < cov.days.length) ? i : -1;
  }
  function covColumnBox(i) {
      var rows = document.getElementById('cvm-rows'), strip = rows && rows.querySelector('.cvm-strip'); if (!strip) return null;
      var cw = strip.clientWidth / cov.days.length;
      return { left: strip.offsetLeft + i * cw, width: Math.max(cw, 2) };
  }
  window.covHover = function(e) {
      var i = covIndexAt(e.clientX), cross = document.getElementById('cvm-cross'), tip = document.getElementById('cvm-tip');
      if (i < 0) { covLeave(); return; }
      var box = covColumnBox(i), day = cov.days[i], today = localDateStr(new Date());
      cross.style.display = 'block'; cross.style.left = box.left + 'px'; cross.style.width = box.width + 'px';
      if (tip.getAttribute('data-d') !== day) {
          tip.setAttribute('data-d', day);
          tip.innerHTML = '<div class="cvm-tip-date">' + covFmtLong(day) + '</div>' + covAll().map(function(ds) {
              var st = covState(ds, day, today);
              return '<div class="cvm-tip-row s-' + st + '"><i></i><span>' + escapeHTML(ds.label) + '</span><em>' + escapeHTML(covDayText(ds, day, today)) + '</em></div>';
          }).join('');
      }
      var wrap = document.getElementById('cvm-rows').getBoundingClientRect();
      var x = e.clientX - wrap.left + 16, maxX = wrap.width - tip.offsetWidth - 8;
      tip.style.display = 'block';
      tip.style.left = Math.max(8, x > maxX ? x - tip.offsetWidth - 32 : x) + 'px';
      tip.style.top = Math.max(0, Math.min(e.clientY - wrap.top - 20, wrap.height - tip.offsetHeight)) + 'px';
  };
  window.covLeave = function() {
      var c = document.getElementById('cvm-cross'), t = document.getElementById('cvm-tip');
      if (c) c.style.display = 'none'; if (t) t.style.display = 'none';
  };
  window.covClick = function(e) { var i = covIndexAt(e.clientX); if (i >= 0) covPickDay(cov.days[i]); };
  window.covPickDay = function(day) {
      cov.day = day;
      // Stepped outside the visible range (arrow keys): show that day's year.
      if (cov.days && cov.days.indexOf(day) === -1) { cov.range = 'year'; cov.year = +day.substring(0, 4); renderCoverage(false, 'range'); return; }
      covPlaceOverlays();
      var det = document.getElementById('cvm-detail'); if (!det) return;
      det.innerHTML = covDetailHtml(day);
      if (covMotion()) gsap.from(det.querySelectorAll('.cvm-d-item'), { y: 6, opacity: 0, duration: 0.25, stagger: 0.02, ease: 'power2.out' });
  };
  function covDetailHtml(day) {
      var today = localDateStr(new Date());
      return '<div class="cvm-d-head"><span class="cvm-d-date">' + covFmtLong(day) + '</span>' + (day === today ? '<span class="cvm-d-today">Today</span>' : '') + '</div>' +
             '<div class="cvm-d-grid">' + covAll().map(function(ds) {
                 var st = covState(ds, day, today), miss = st === 'miss' || st === 'due';
                 return '<div class="cvm-d-item s-' + st + '"><i></i><div><div class="cvm-d-name">' + escapeHTML(ds.label) + '</div><div class="cvm-d-txt">' + escapeHTML(covDayText(ds, day, today)) + (miss ? ' — ' + escapeHTML(ds.how) : '') + '</div></div></div>';
             }).join('') + '</div>';
  }
  // Today line + selected-day marker sit over the strips column.
  function covPlaceOverlays() {
      if (!cov.days) return;
      var today = localDateStr(new Date());
      var put = function(id, day) {
          var el = document.getElementById(id); if (!el) return;
          var i = cov.days.indexOf(day), box = i >= 0 ? covColumnBox(i) : null;
          if (!box) { el.style.display = 'none'; return; }
          el.style.display = 'block'; el.style.left = box.left + 'px'; el.style.width = box.width + 'px';
      };
      put('cvm-today', today); put('cvm-sel', cov.day);
  }

  function renderCoverage(entrance, change) {
      var ov = document.getElementById('cov-overlay'); if (!ov) return;
      var panel = ov.querySelector('.cov-panel');
      var today = localDateStr(new Date()), list = covAll(), loading = !state.coverage;
      var days = covRangeDays(); cov.days = days;
      var order = { bad: 0, warn: 1, ok: 2, none: 3 };
      var rated = list.map(function(ds) { return { ds: ds, st: covStatus(ds, today) }; }).sort(function(a, b) { return order[a.st.level] - order[b.st.level]; });
      var need = rated.filter(function(x) { return x.st.level === 'bad' || x.st.level === 'warn'; });

      // Plain-language summary instead of a wall of cards.
      var summary = loading ? 'Reading every dataset…'
          : !need.length ? 'Everything is up to date.'
          : need.length + ' of ' + list.length + ' datasets need attention' + (need.filter(function(x) { return x.st.level === 'bad'; }).length ? ' — ' + need.filter(function(x) { return x.st.level === 'bad'; }).map(function(x) { return x.ds.label; }).join(', ') + ' missing today.' : '.');

      // Month ticks along the top of the strips column (in %).
      var ticks = '';
      days.forEach(function(d, i) {
          if (d.substring(8) === '01' || i === 0) ticks += '<span class="cvm-tick" style="left:' + (i / days.length * 100).toFixed(3) + '%;">' + COV_MONTHS[+d.substring(5, 7) - 1] + (d.substring(5, 7) === '01' || i === 0 ? ' ' + d.substring(0, 4) : '') + '</span>';
      });

      var rows = rated.map(function(x) {
          var ds = x.ds, st = x.st, n = days.length, rects = '';
          for (var i = 0; i < n; i++) rects += '<rect class="k-' + covState(ds, days[i], today) + '" x="' + i + '" y="0" width="0.82" height="1"/>';
          var pct = covPct(ds, days, today);
          var act = COV_ACTION[ds.key] ? COV_ACTION[ds.key][0] : 'Import';
          var sync = ds.lastSync ? 'last import ' + escapeHTML(ds.lastSync.text) : (ds.key === 'calc' ? 'logged each calculator run' : 'no import on record');
          return '<div class="cvm-row">' +
                 '<div class="cvm-meta"><div class="cvm-name">' + escapeHTML(ds.label) + '</div>' +
                   '<div class="cvm-status"><span class="lv-' + st.level + '">' + escapeHTML(st.text) + '</span></div><div class="cvm-sync">' + sync + '</div></div>' +
                 '<div class="cvm-strip"><svg viewBox="0 0 ' + n + ' 1" preserveAspectRatio="none" shape-rendering="crispEdges">' + rects + '</svg></div>' +
                 '<div class="cvm-side"><span class="cvm-pct" title="Expected days covered in this range">' + (pct == null ? '—' : pct + '%') + '</span>' +
                   ((st.level === 'bad' || st.level === 'warn' || st.level === 'none') ? '<button class="cvm-btn" onclick="covAction(\'' + ds.key + '\')">' + act + '</button>' : '<span class="cvm-btn-ghost"></span>') + '</div>' +
                 '</div>';
      }).join('');

      var seg = function(r, label) { return '<button class="' + (cov.range === r ? 'on' : '') + '" onclick="covSetRange(\'' + r + '\')">' + label + '</button>'; };
      panel.innerHTML =
          '<div class="cov-head">' +
            '<div><div class="cov-title">Data coverage</div><div class="cov-sub">' + escapeHTML(summary) + '</div></div>' +
            '<div class="cov-head-r">' +
              '<div class="cvm-seg">' + seg('30', '30 days') + seg('90', '90 days') + seg('year', 'Year') + '</div>' +
              (cov.range === 'year' ? '<div class="cov-year"><button onclick="covSetYear(-1)" aria-label="Previous year">‹</button><span>' + cov.year + '</span><button onclick="covSetYear(1)" aria-label="Next year">›</button></div>' : '') +
              '<button class="cov-x" onclick="closeCoverage()" aria-label="Close">&times;</button>' +
            '</div>' +
          '</div>' +
          '<div class="cvm">' +
            '<div class="cvm-axis"><div class="cvm-meta"></div><div class="cvm-ticks">' + ticks + '</div><div class="cvm-side"></div></div>' +
            '<div class="cvm-rows custom-scrollbar" id="cvm-rows" onmousemove="covHover(event)" onmouseleave="covLeave()" onclick="covClick(event)">' + rows +
              '<div class="cvm-line cvm-today-line" id="cvm-today"></div><div class="cvm-line cvm-sel-line" id="cvm-sel"></div><div class="cvm-cross" id="cvm-cross"></div><div class="cvm-tip" id="cvm-tip"></div>' +
            '</div>' +
            '<div class="cvm-legend"><span><i class="k-full"></i>Imported</span><span><i class="k-part"></i>Partial</span><span><i class="k-miss"></i>Missing</span><span><i class="k-due"></i>Due</span><span><i class="k-ahead"></i>Already in (future)</span><span><i class="k-none"></i>Not expected</span><span class="cvm-legend-today"><i></i>Today</span></div>' +
          '</div>' +
          '<div class="cvm-detail" id="cvm-detail">' + (loading ? '' : covDetailHtml(cov.day)) + '</div>';

      covPlaceOverlays();
      if (!covMotion()) return;
      var q = function(s) { return panel.querySelectorAll(s); };
      if (entrance) {
          gsap.fromTo(ov, { opacity: 0 }, { opacity: 1, duration: 0.25 });
          gsap.from(panel, { y: 24, scale: 0.98, opacity: 0, duration: 0.45, ease: 'power3.out' });
      }
      if (entrance || change === 'range') {
          // Each row's timeline draws left → right, staggered down the list.
          gsap.fromTo(q('.cvm-strip svg'), { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: entrance ? 0.9 : 0.6, stagger: 0.05, ease: 'power2.inOut', delay: entrance ? 0.15 : 0, clearProps: 'clipPath' });
          gsap.from(q('.cvm-meta, .cvm-side'), { opacity: 0, x: -6, duration: 0.35, stagger: 0.02, delay: entrance ? 0.15 : 0, ease: 'power2.out' });
          gsap.from(q('.cvm-today-line'), { scaleY: 0, transformOrigin: '50% 0%', duration: 0.6, delay: entrance ? 0.6 : 0.3, ease: 'power3.out' });
      }
  }



  // ── Import window: what needs importing + what this paste is ──────────────
  // Lists the datasets that need updating (from the coverage data) with a
  // 14-day strip each, and as text is pasted names the report it recognises
  // (detectImportKind — the same sniffer the Sync button uses) and, for WFM /
  // IDP pastes, the dates it covers. The matching row is highlighted.
  var IMPORT_KIND_TO_DS = { sched: 'wfm', idp: 'idp', forecast: 'forecast', otopen: 'otopen', safe: 'safe', genesys: 'genesys', activity: 'activity', alarms: 'alarms' };
  var importInputTimer = null;
  window.onImportInput = function() { clearTimeout(importInputTimer); importInputTimer = setTimeout(renderImportHealth, 160); };

  // Dates a paste covers, when the report says so (WFM "Date Range:", IDP
  // column headers "Oct 29, 2026").
  function importPasteRange(kind, t) {
      var head = t.substring(0, 20000);
      if (kind === 'sched') {
          var m = head.match(/Date Range:\s*(\d{1,2}\/\d{1,2}\/\d{2,4})\s*-\s*(\d{1,2}\/\d{1,2}\/\d{2,4})/i);
          if (m) { var f = function(x) { var p = x.split('/'), y = +p[2]; if (y < 100) y += 2000; return y + '-' + (+p[0] < 10 ? '0' : '') + +p[0] + '-' + (+p[1] < 10 ? '0' : '') + +p[1]; }; return [f(m[1]), f(m[2])]; }
      }
      if (kind === 'idp') {
          var ds = [], re = /\b([A-Z][a-z]{2,8}\.?\s\d{1,2},?\s\d{4})\b/g, x;
          while ((x = re.exec(head)) && ds.length < 400) { var d = new Date(x[1].replace('.', '')); if (!isNaN(d)) ds.push(localDateStr(d)); }
          ds.sort(); if (ds.length) return [ds[0], ds[ds.length - 1]];
      }
      return null;
  }

  function importStrip(ds, today) {
      var rects = '';
      for (var i = 13; i >= 0; i--) { var d = covAdd(today, -i); rects += '<rect class="k-' + covState(ds, d, today) + '" x="' + (13 - i) + '" y="0" width="0.8" height="1"/>'; }
      return '<svg viewBox="0 0 14 1" preserveAspectRatio="none" shape-rendering="crispEdges">' + rects + '</svg>';
  }

  function renderImportHealth() {
      var box = document.getElementById('import-health'), det = document.getElementById('import-detect');
      if (!box || !det) return;
      var ta = document.getElementById('import-text'), t = ta ? ta.value : '';
      var kind = t.trim() ? detectImportKind(t) : '';
      // "sched" is the Sync fallback for anything unrecognised — only claim it
      // when the paste actually looks like the WFM Agent Schedules report.
      if (kind === 'sched' && !/agent schedules|agent:\s*\d+/i.test(t.substring(0, 20000))) kind = 'unknown';
      var dsKey = IMPORT_KIND_TO_DS[kind] || '';
      var list = covAll(), today = localDateStr(new Date());
      var match = list.filter(function(x) { return x.key === dsKey; })[0];

      if (!kind) det.innerHTML = '';
      else if (kind === 'unknown') det.innerHTML = '<span class="imp-det-k">Not recognised</span><span class="imp-det-t">Sync will try it as a WFM schedule.</span>';
      else {
          var rng = importPasteRange(kind, t);
          det.innerHTML = '<span class="imp-det-k">This looks like</span><span class="imp-det-name">' + escapeHTML(match ? match.label : kind) + '</span>' +
              (rng ? '<span class="imp-det-t">' + covFmt(rng[0]) + (rng[1] !== rng[0] ? ' – ' + covFmt(rng[1]) + ', ' + rng[1].substring(0, 4) : ', ' + rng[0].substring(0, 4)) + '</span>' : '') +
              ((kind === 'safe' || kind === 'genesys') ? '<span class="imp-det-t">· pick its period below</span>' : '');
      }

      if (!state.coverage) { box.innerHTML = ''; return; }
      var need = list.map(function(ds) { return { ds: ds, st: covStatus(ds, today) }; })
          .filter(function(x) { return (x.st.level === 'bad' || x.st.level === 'warn') && x.ds.key !== 'calc' && x.ds.key !== 'gem'; });   // calc / GEM aren't fed from here
      var okN = list.length - need.length;
      var prevMatch = box.getAttribute('data-match') || '';
      box.setAttribute('data-match', dsKey);
      box.innerHTML = '<div class="imp-h-head"><span>' + (need.length ? 'Needs importing' : 'Nothing needs importing') + '</span>' +
              '<button class="imp-h-all" onclick="closeImportModal(); openCoverage();">All data coverage</button></div>' +
          need.map(function(x) {
              return '<div class="imp-h-row' + (x.ds.key === dsKey ? ' match' : '') + '"><div class="imp-h-name">' + escapeHTML(x.ds.label) + '</div>' +
                     '<div class="imp-h-st lv-' + x.st.level + '">' + escapeHTML(x.st.text) + '</div>' +
                     '<div class="imp-h-strip" title="Last 14 days">' + importStrip(x.ds, today) + '</div></div>';
          }).join('') +
          (need.length && okN > 0 ? '<div class="imp-h-ok">' + okN + ' other dataset' + (okN === 1 ? ' is' : 's are') + ' up to date</div>' : '');
      if (dsKey && dsKey !== prevMatch && typeof gsap !== 'undefined') {
          var row = box.querySelector('.imp-h-row.match');
          if (row) gsap.fromTo(row, { opacity: 0.35, x: -6 }, { opacity: 1, x: 0, duration: 0.45, ease: 'power2.out', clearProps: 'opacity,transform' });
      }
  }

</script>
