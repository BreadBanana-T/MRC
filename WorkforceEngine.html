<script>
/**
 * MRC WORKFORCE — break & lunch optimizer engine.
 *
 * Pure logic, no DOM: the Workforce page drives it, and the node tests load the
 * body of this <script> directly (module.exports at the bottom).
 *
 * Model of a day
 *   - Minutes are day-minutes on the selected date, 0..2880 (an overnight shift
 *     runs past 1440). Occupancy is tracked in 5-minute slots.
 *   - Each scheduled agent has FIXED blocks (Training, ACSU, SAFE, part-day
 *     absences…) that never move, and MOVABLE blocks (breaks and lunches) whose
 *     count and length come from the paid-break grid for the shift length.
 *   - The current floor plan (IEX, plus any floor edits) seeds the movable blocks.
 *
 * Score (lower is better, "risk points") — no hard caps, per product owner:
 *   1. Overlap: for every 5-minute slot and every protection group, the sum over
 *      PAIRS of agents off-queue together of w_i·w_j, scaled by the group's
 *      absence pressure and divided by how many of that group are on shift.
 *      Weights make Bilingual overlaps expensive, French next, then L4 /
 *      Question Line / Escalation; English is nearly free and fills around them.
 *      Groups: BL, FR, EN, FRC (French cover = FR + BL together) and SR
 *      (seniors: L4, Question Line, Escalation — any language).
 *   2. IDP: λ · shortfall² per slot where the IDP Required is above the agents
 *      left on queue.
 *   3. Churn: μ · minutes moved away from the current plan, so nothing moves
 *      unless it actually helps.
 */
(function (root) {
  'use strict';

  var SLOT = 5;
  var DAY_SPAN = 2880;
  var NSLOT = DAY_SPAN / SLOT;
  var GROUPS = ['BL', 'FR', 'EN', 'FRC', 'SR'];
  var G_IDX = { BL: 0, FR: 1, EN: 2, FRC: 3, SR: 4 };

  // Paid-break grid (product owner's table). seq tokens: B = paid break,
  // L = paid lunch, U = unpaid lunch; the number is minutes. Rows are matched on
  // the gross shift span (end − start), the longest row not above it. A row with
  // site 'CALG' is used only for Calgary agents, and up to its spanMax (the 4/3
  // compressed day is 9h paid + 30 unpaid, so its span can read 9 or 9.5).
  var DEFAULT_RULES = {
    version: 1,
    grid: [
      { hours: 4,   label: '4 hrs',             seq: 'B15' },
      { hours: 5,   label: '5 hrs / 5 hrs CALG', seq: 'B15' },
      { hours: 6,   label: '6 hrs',             seq: 'L30' },
      { hours: 6.5, label: '6.5 hrs',           seq: 'L30' },
      { hours: 7,   label: '7 hrs',             seq: 'B15 L30 B15' },
      { hours: 7.5, label: '7.5 hrs',           seq: 'B15 L30 B15' },
      { hours: 8,   label: '8 hrs',             seq: 'B15 L30 B15' },
      { hours: 8.5, label: '8.5 hrs',           seq: 'B15 L30 B15' },
      { hours: 9,   label: '9 hrs (4/3 CALG)',  seq: 'B15 U30 B15', site: 'CALG', spanMax: 9.5 },
      { hours: 9.5, label: '9.5 hrs',           seq: 'B10 L30 B10 B10' },
      { hours: 10,  label: '10 hrs',            seq: 'B10 L30 B10 B10' }
    ],
    // "Tighter spacing" defaults. gapMin is on-queue time between the end of
    // one block and the start of the next.
    windows: { firstMin: 120, gapMin: 90, lastBeforeEndMin: 60, snap: 15, lunchMiddleThird: true },
    weights: { BL: 10, FR: 6, EN: 1, L4: 3, QL: 2, ESC: 2, traineeMult: 0.5 },
    idpLambda: 2,
    // Moving a block away from the current plan. On the 15-min grid a 15-min
    // move is the normal, cheap one; 30 is expensive (it has to save about a
    // whole Bilingual overlap) and capped to maxBigShare of all moved blocks;
    // more than maxMin only ever happens when the current time breaks the
    // spacing rules ("rule fix").
    moves: { cost15: 3, cost30: 40, maxMin: 30, maxBigShare: 0.10 },
    // Demand on top of the IDP (CORE/DemandSignals.gs computes the factors; the
    // server reads svlTarget / liveWindowMin / minSamples from saved rules).
    demand: { svlTarget: 90, liveWindowMin: 90, minSamples: 12, maxUplift: 0.5 },
    liveLeadMin: 15
  };

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function mergeRules(saved) {
    var r = clone(DEFAULT_RULES);
    if (!saved || typeof saved !== 'object') return r;
    if (Array.isArray(saved.grid) && saved.grid.length) r.grid = saved.grid;
    ['windows', 'weights', 'moves', 'demand'].forEach(function (k) {
      if (saved[k] && typeof saved[k] === 'object') for (var p in saved[k]) if (saved[k][p] !== '' && saved[k][p] != null) r[k][p] = saved[k][p];
    });
    ['idpLambda', 'liveLeadMin'].forEach(function (k) { if (saved[k] !== '' && saved[k] != null && !isNaN(Number(saved[k]))) r[k] = Number(saved[k]); });
    r.grid = r.grid.map(function (g) { return { hours: Number(g.hours), label: String(g.label || (g.hours + ' hrs')), seq: String(g.seq || ''), site: g.site || '', spanMax: g.spanMax != null && g.spanMax !== '' ? Number(g.spanMax) : null }; })
      .filter(function (g) { return !isNaN(g.hours); })
      .sort(function (a, b) { return a.hours - b.hours; });
    return r;
  }

  function parseSeq(seq) {
    var out = [];
    String(seq || '').toUpperCase().split(/[\s,;+]+/).forEach(function (tok) {
      var m = tok.match(/^([BLU])(\d{1,3})$/);
      if (!m) return;
      var dur = parseInt(m[2], 10);
      if (!dur) return;
      out.push({ type: m[1] === 'B' ? 'Break' : 'Lunch', dur: dur, unpaid: m[1] === 'U' });
    });
    return out;
  }

  // Grid row for a shift span in minutes, or null under the smallest row.
  function ruleFor(spanMin, calgary, rules) {
    var h = spanMin / 60 + 1e-6;
    var grid = rules.grid;
    if (calgary) {
      for (var i = 0; i < grid.length; i++) {
        var g = grid[i];
        if (g.site && /calg/i.test(g.site) && h >= g.hours && h <= (g.spanMax || g.hours) + 1e-6) return g;
      }
    }
    var best = null;
    for (var j = 0; j < grid.length; j++) {
      if (grid[j].site) continue;
      if (grid[j].hours <= h) best = grid[j];
    }
    return best;
  }

  function agentWeight(a, W) {
    var w = Number(W[a.lang] != null ? W[a.lang] : W.EN) || 1;
    if (Number(a.level) === 4) w += Number(W.L4) || 0;
    if (a.isQL) w += Number(W.QL) || 0;
    if (a.isESC) w += Number(W.ESC) || 0;
    if (a.trainee) w *= (W.traineeMult != null ? Number(W.traineeMult) : 1);
    return Math.max(0.01, w);
  }

  function agentGroups(a) {
    var g = [];
    if (a.lang === 'BL') g.push(G_IDX.BL, G_IDX.FRC);
    else if (a.lang === 'FR') g.push(G_IDX.FR, G_IDX.FRC);
    else g.push(G_IDX.EN);
    if (a.isSenior) g.push(G_IDX.SR);
    return g;
  }

  function slotOf(m) { return Math.max(0, Math.min(NSLOT, Math.floor(m / SLOT))); }
  function slotEnd(m) { return Math.max(0, Math.min(NSLOT, Math.ceil(m / SLOT))); }
  function snapUp(m, snap) { return Math.ceil(m / snap) * snap; }
  function snapDown(m, snap) { return Math.floor(m / snap) * snap; }
  function sq(x) { return x > 0 ? x * x : 0; }

  // Relaxation ladder: level 0 is the configured rule; each step loosens it
  // until a shift that can't fit (short shifts, big fixed blocks) has a layout.
  function windowLevels(W) {
    var base = { firstMin: Number(W.firstMin), gapMin: Number(W.gapMin), last: Number(W.lastBeforeEndMin), third: !!W.lunchMiddleThird };
    return [
      base,
      { firstMin: Math.min(base.firstMin, 90), gapMin: Math.min(base.gapMin, 60), last: Math.min(base.last, 45), third: base.third },
      { firstMin: Math.min(base.firstMin, 60), gapMin: Math.min(base.gapMin, 45), last: Math.min(base.last, 30), third: false },
      { firstMin: 30, gapMin: 15, last: 15, third: false }
    ];
  }

  // Static [lo, hi] start bounds for each movable block at a window level.
  function staticBounds(ag, lv, snap) {
    var S = ag.S, E = ag.E, L = E - S, n = ag.acts.length;
    return ag.acts.map(function (act, k) {
      var lo = S + (k === 0 ? lv.firstMin : 0);
      var hi = E - act.dur - (k === n - 1 ? lv.last : 0);
      if (lv.third && act.type === 'Lunch') {
        var tlo = S + L / 3, thi = S + 2 * L / 3 - act.dur;
        if (thi >= tlo) { lo = Math.max(lo, tlo); hi = Math.min(hi, thi); }
      }
      return [snapUp(lo, snap), snapDown(hi, snap)];
    });
  }

  function overlapsFixed(ag, s, e) {
    for (var i = 0; i < ag.fixed.length; i++) {
      var f = ag.fixed[i];
      if (f.blocks === false) continue;
      if (s < f.e && e > f.s) return true;
    }
    return false;
  }

  // Cheapest legal layout of one agent's blocks at window level lv, solved
  // exactly by dynamic programming over the blocks in order: each block's legal
  // starts are a handful of grid slots, and the only coupling between blocks is
  // the gap rule. costOf(act, k, start) prices one block at one start.
  // Returns { starts, cost } or null when nothing legal fits.
  function solveLayout(ag, lv, snap, live, costOf) {
    var n = ag.acts.length;
    if (!n) return { starts: [], cost: 0 };
    var b = staticBounds(ag, lv, snap), cand = [], cost = [], best = [], prev = [];
    for (var k = 0; k < n; k++) {
      var act = ag.acts[k], list = [];
      if (act.locked) list.push(act.s);   // pinned or already in the past: taken as given
      else {
        var lo = b[k][0];
        if (live != null) lo = Math.max(lo, snapUp(live, snap));
        for (var s = lo; s <= b[k][1]; s += snap) if (!overlapsFixed(ag, s, s + act.dur)) list.push(s);
      }
      if (!list.length) return null;
      cand.push(list);
      cost.push(list.map(function (st) { return costOf(act, k, st); }));
    }
    best.push(cost[0].slice());
    prev.push(cost[0].map(function () { return -1; }));
    for (var k2 = 1; k2 < n; k2++) {
      var row = [], pr = [], pd = ag.acts[k2 - 1].dur, pc = cand[k2 - 1], pb = best[k2 - 1];
      for (var i = 0; i < cand[k2].length; i++) {
        var lim = ag.acts[k2].locked ? Infinity : cand[k2][i] - pd - lv.gapMin, bv = Infinity, bj = -1;
        for (var j = 0; j < pc.length; j++) {
          if (pc[j] > lim) break;
          if (pb[j] < bv) { bv = pb[j]; bj = j; }
        }
        row.push(bj < 0 ? Infinity : bv + cost[k2][i]); pr.push(bj);
      }
      best.push(row); prev.push(pr);
    }
    var last = best[n - 1], bi = -1, bc = Infinity;
    for (var q = 0; q < last.length; q++) if (last[q] < bc) { bc = last[q]; bi = q; }
    if (bi < 0 || !isFinite(bc)) return null;
    var starts = new Array(n);
    for (var k3 = n - 1; k3 >= 0; k3--) { starts[k3] = cand[k3][bi]; bi = prev[k3][bi]; }
    return { starts: starts, cost: bc };
  }

  // Is the layout `starts` valid for agent at level lv?
  function validLayout(ag, starts, lv, snap) {
    var b = staticBounds(ag, lv, snap), prevEnd = -Infinity;
    for (var k = 0; k < starts.length; k++) {
      var s = starts[k], d = ag.acts[k].dur;
      if (s == null || isNaN(s)) return false;
      if (!ag.acts[k].locked && (s < b[k][0] || s > b[k][1])) return false;
      if (!ag.acts[k].locked && s < prevEnd + lv.gapMin) return false;
      if (!ag.acts[k].locked && overlapsFixed(ag, s, s + d)) return false;
      prevEnd = s + d;
    }
    return true;
  }

  // Factors that actually move the need curve for this plan.
  function demandFactors(day, opts) {
    var off = (opts && opts.demandOff) || {};
    return ((day.demand && day.demand.factors) || []).filter(function (f) {
      return f && f.kind !== 'headsup' && Number(f.pct) && !off[f.id];
    });
  }

  /**
   * Build the working model.
   * day:  payload from BreakPlanner.getDay (agents[], idp.req[96], …)
   * opts: { nowMin: number|null (live mode lock line), locks: {"key:k": true}, pins: {"key:k": start} }
   */
  function buildModel(day, rulesIn, opts) {
    opts = opts || {};
    var rules = mergeRules(rulesIn);
    var W = rules.weights, snap = Number(rules.windows.snap) || 15;
    var levels = windowLevels(rules.windows);
    var live = opts.nowMin != null ? Number(opts.nowMin) + (Number(rules.liveLeadMin) || 0) : null;

    var agents = [], absentByG = [0, 0, 0, 0, 0], schedByG = [0, 0, 0, 0, 0];
    (day.agents || []).forEach(function (a) {
      if (a.s == null || a.e == null || !(a.e > a.s)) return;
      var ag = {
        key: a.key, name: a.name, id: a.id || '', region: a.region || '', lang: a.lang || 'EN',
        level: a.level, trainee: !!a.trainee, isQL: !!a.isQL, isESC: !!a.isESC,
        supervisor: a.supervisor || '', site: a.site || '', calgary: !!a.calgary,
        absent: a.absent || '', fullAbsent: !!a.fullAbsent, hasOverride: !!a.hasOverride,
        S: Number(a.s), E: Number(a.e), fixed: [], acts: [], extra: [], level0: 0,
        relaxed: 0, infeasible: false, mismatch: '', rule: null
      };
      ag.isSenior = Number(ag.level) === 4 || ag.isQL || ag.isESC;
      ag.w = agentWeight(ag, W);
      ag.groups = agentGroups(ag);
      ag.groups.forEach(function (g) { schedByG[g]++; if (ag.fullAbsent) absentByG[g]++; });
      if (ag.fullAbsent) { agents.push(ag); return; }

      // Split current blocks into fixed and movable.
      var cur = (a.acts || []).slice().sort(function (x, y) { return x.s - y.s; });
      var curMov = [];
      cur.forEach(function (b) {
        if (b.fixed) ag.fixed.push({ type: b.type, s: Number(b.s), e: Number(b.e), rs: b.rs, re: b.re, abs: b.abs, blocks: true });
        else curMov.push({ type: b.type, s: Number(b.s), e: Number(b.e) });
      });

      var rule = ruleFor(ag.E - ag.S, ag.calgary, rules);
      ag.rule = rule ? rule.label : '';
      var need = rule ? parseSeq(rule.seq) : [];
      // Seed each required block from the current plan, matched by type in order.
      var pools = { Break: curMov.filter(function (b) { return b.type === 'Break'; }), Lunch: curMov.filter(function (b) { return b.type === 'Lunch'; }) };
      var used = { Break: 0, Lunch: 0 };
      need.forEach(function (n, k) {
        var src = pools[n.type][used[n.type]++];
        ag.acts.push({ type: n.type, dur: n.dur, unpaid: n.unpaid, s: src ? src.s : null, orig: src ? src.s : null, origDur: src ? (src.e - src.s) : null, locked: false, pinned: false, k: k });
      });
      // Current blocks the rule doesn't ask for stay where they are as fixed
      // blocks, so the floor doesn't silently lose a break IEX gave someone.
      ['Break', 'Lunch'].forEach(function (t) {
        pools[t].slice(used[t]).forEach(function (b) { ag.extra.push(b); ag.fixed.push({ type: t, s: b.s, e: b.e, extra: true, blocks: true }); });
      });
      var haveB = pools.Break.length, haveL = pools.Lunch.length;
      var needB = need.filter(function (n) { return n.type === 'Break'; }).length, needL = need.length - needB;
      // A missing PAID lunch is normal (the WFM import skips "Paid Lunch" lines),
      // so it's simply added; only a different break count or an extra lunch is flagged.
      if (haveB !== needB || haveL > needL) ag.mismatch = 'Current plan has ' + haveB + 'B/' + haveL + 'L, rule ' + (rule ? rule.label : 'none') + ' wants ' + needB + 'B/' + needL + 'L';

      // Locks: live mode freezes anything already started/imminent; user pins.
      ag.acts.forEach(function (act) {
        var lk = ag.key + ':' + act.k;
        if (opts.pins && opts.pins[lk] != null) { act.s = Number(opts.pins[lk]); act.locked = true; act.pinned = true; }
        else if (opts.locks && opts.locks[lk]) { act.locked = act.s != null; act.pinned = act.locked; }
        if (live != null && act.s != null && act.s < live) { act.locked = true; act.past = true; }
      });

      // Pick the strictest window level the agent can satisfy. When the current
      // times break the rules, repair to the CLOSEST legal layout (fewest blocks
      // moved, then fewest minutes) instead of just the earliest one; a missing
      // block goes to the middle of its window.
      var lvUsed = -1, layout = null;
      for (var li = 0; li < levels.length; li++) {
        var cand = ag.acts.map(function (x) { return x.s; });
        if (cand.every(function (v) { return v != null; }) && validLayout(ag, cand, levels[li], snap)) { lvUsed = li; layout = cand; break; }
        var bnd = staticBounds(ag, levels[li], snap);
        var sol = solveLayout(ag, levels[li], snap, live, function (act, k, st) {
          if (act.s == null) return Math.abs(st - (bnd[k][0] + bnd[k][1]) / 2) * 0.001;
          var d = Math.abs(st - act.s);
          return d ? 1000 + d : 0;
        });
        if (sol) { lvUsed = li; layout = sol.starts; break; }
      }
      if (lvUsed === -1) {
        // Nothing legal fits (usually live mode late in a shift, or big fixed
        // blocks). Keep what the current plan has, frozen, and leave out any
        // missing block rather than inventing one in the past.
        ag.infeasible = true;
        ag.skipped = ag.acts.filter(function (x) { return x.s == null; }).length;
        ag.acts = ag.acts.filter(function (x) { return x.s != null; });
        ag.acts.forEach(function (x) { x.locked = true; x.anchor = x.orig; });
      } else {
        ag.relaxed = lvUsed; ag.lv = levels[lvUsed];
        ag.acts.forEach(function (x, k) {
          x.s = layout[k];
          // The rules forced this block off its current time: that's a "rule
          // fix", and moves are measured from the repaired time from here on.
          x.ruleFix = x.orig != null && x.s !== x.orig;
          x.anchor = x.orig == null ? null : x.s;
        });
      }
      agents.push(ag);
    });

    // Group pressure: a heavy sick day in a group makes its overlaps cost more.
    var pressure = GROUPS.map(function (g, i) { return 1 + (schedByG[i] ? absentByG[i] / schedByG[i] : 0); });

    var onShift = GROUPS.map(function () { return new Float64Array(NSLOT); });
    var onShiftAll = new Float64Array(NSLOT);
    agents.forEach(function (ag) {
      if (ag.fullAbsent) return;
      for (var t = slotOf(ag.S); t < slotEnd(ag.E); t++) {
        onShiftAll[t]++;
        ag.groups.forEach(function (g) { onShift[g][t]++; });
      }
    });
    var f = GROUPS.map(function (g, i) {
      var arr = new Float64Array(NSLOT);
      for (var t = 0; t < NSLOT; t++) arr[t] = pressure[i] / Math.max(1, onShift[i][t]);
      return arr;
    });

    // IDP Required per 15-min bucket → per 5-min slot: the selected date, then
    // the next date for overnight slots past 24:00.
    var idpRaw = new Float64Array(NSLOT).fill(-1);
    var idp = (day.idp && day.idp.req) || [], idpN = (day.idpNext && day.idpNext.req) || [];
    for (var t = 0; t < NSLOT; t++) {
      var src = t < 288 ? idp : idpN, v = src[Math.floor((t % 288) / 3)];
      if (v != null && v !== '' && !isNaN(Number(v))) idpRaw[t] = Number(v);
    }
    // Need = IDP × (1 + active uplifts). Heads-up factors never apply; any
    // factor can be switched off for this plan (opts.demandOff[id]).
    var dm = demandFactors(day, opts);
    var maxUp = Number(rules.demand && rules.demand.maxUplift);
    if (isNaN(maxUp)) maxUp = 0.5;
    var mult = new Float64Array(NSLOT).fill(1);
    dm.forEach(function (fac) {
      var from = fac.from != null ? Number(fac.from) : 0, to = fac.to != null ? Number(fac.to) : DAY_SPAN;
      for (var t2 = slotOf(from); t2 < slotEnd(to); t2++) {
        var wgt = fac.decay ? Math.max(0, 1 - ((t2 * SLOT) - from) / Math.max(1, to - from)) : 1;
        mult[t2] += Number(fac.pct) * wgt;
      }
    });
    var req = new Float64Array(NSLOT).fill(-1);
    for (var t3 = 0; t3 < NSLOT; t3++) if (idpRaw[t3] >= 0) req[t3] = idpRaw[t3] * Math.max(0.8, Math.min(1 + maxUp, mult[t3]));

    var model = {
      rules: rules, snap: snap, levels: levels, live: live, agents: agents, pressure: pressure,
      onShift: onShift, onShiftAll: onShiftAll, f: f, req: req, idpRaw: idpRaw, demand: dm,
      S1: GROUPS.map(function () { return new Float64Array(NSLOT); }),
      S2: GROUPS.map(function () { return new Float64Array(NSLOT); }),
      offCnt: GROUPS.map(function () { return new Float64Array(NSLOT); }),
      offAll: new Float64Array(NSLOT),
      lambda: Number(rules.idpLambda) || 0,
      moves: rules.moves, bigMult: 1, forbidBig: null
    };
    agents.forEach(function (ag) {
      ag.occ = new Uint8Array(NSLOT);
      if (ag.fullAbsent) return;
      ag.fixed.forEach(function (fx) { addInterval(model, ag, fx.s, fx.e, 1); });
      ag.acts.forEach(function (act) { addInterval(model, ag, act.s, act.s + act.dur, 1); });
    });
    return model;
  }

  function setOff(model, ag, t, sign) {
    var w = ag.w, gs = ag.groups;
    for (var i = 0; i < gs.length; i++) {
      var g = gs[i];
      model.S1[g][t] += sign * w;
      model.S2[g][t] += sign * w * w;
      model.offCnt[g][t] += sign;
    }
    model.offAll[t] += sign;
  }

  function addInterval(model, ag, s, e, sign) {
    // Only the part inside the shift takes the agent off queue.
    var a = slotOf(Math.max(s, ag.S)), b = slotEnd(Math.min(e, ag.E));
    for (var t = a; t < b; t++) {
      if (sign > 0) { if (ag.occ[t]++ === 0) setOff(model, ag, t, 1); }
      else { if (--ag.occ[t] === 0) setOff(model, ag, t, -1); }
    }
  }

  // Marginal cost of taking `ag` off queue over [s, e) given everything else.
  function addCost(model, ag, s, e) {
    var a = slotOf(Math.max(s, ag.S)), b = slotEnd(Math.min(e, ag.E)), c = 0, w = ag.w, gs = ag.groups, lam = model.lambda;
    for (var t = a; t < b; t++) {
      if (ag.occ[t]) continue;
      for (var i = 0; i < gs.length; i++) { var g = gs[i]; c += model.f[g][t] * w * model.S1[g][t]; }
      var R = model.req[t];
      if (lam && R >= 0) { var onQ = model.onShiftAll[t] - model.offAll[t]; c += lam * (sq(R - onQ + 1) - sq(R - onQ)); }
    }
    return c;
  }

  // Cost of putting a block at s, measured from its anchor (the current time,
  // or the repaired time when the rules forced it off). 15 min is cheap, up to
  // maxMin is expensive, beyond that only when nothing else is legal.
  function moveCost(model, act, s) {
    if (act.anchor == null || s === act.anchor) return 0;   // added block, or where it already is
    var M = model.moves, total = Math.abs(s - act.orig);
    if (!total) return 0;
    // Priced on the TOTAL distance from the current plan's time, so a block the
    // rules already pushed 15 can't quietly take 15 more and become a 30.
    if (total <= 15) return M.cost15 * total / 15;
    if (total <= M.maxMin) {
      if (model.forbidBig && !act.pinned) return 1e5 + total * 100;
      return M.cost30 * model.bigMult * total / 30;
    }
    // Past the cap: only the rule-fix time itself (handled above) is allowed.
    return act.pinned ? M.cost30 * total / 30 : 1e5 + total * 100;
  }

  // What kind of move a block is: 0, 15, 30 ("big"), 'fix' (rules forced it,
  // or a manual drag past the cap) or 'added' (the grid requires it, the
  // current plan doesn't have it).
  function moveKind(model, act) {
    if (act.orig == null) return 'added';
    if (act.s === act.orig) return 0;
    var d = Math.abs(act.s - act.orig);
    if (act.pinned) return d <= 15 ? 15 : 30;   // a manual drag: shown, never reverted
    if (act.ruleFix && act.s === act.anchor) return 'fix';
    if (d <= 15) return 15;
    if (d <= model.moves.maxMin) return 30;
    return 'fix';
  }

  // Legal start range for block k given the agent's other blocks.
  function rangeFor(model, ag, k) {
    var lv = ag.lv || model.levels[model.levels.length - 1], snap = model.snap;
    var b = staticBounds(ag, lv, snap)[k];
    var lo = b[0], hi = b[1];
    if (k > 0) lo = Math.max(lo, snapUp(ag.acts[k - 1].s + ag.acts[k - 1].dur + lv.gapMin, snap));
    if (k < ag.acts.length - 1) hi = Math.min(hi, snapDown(ag.acts[k + 1].s - lv.gapMin - ag.acts[k].dur, snap));
    if (model.live != null) lo = Math.max(lo, snapUp(model.live, snap));
    return [lo, hi];
  }

  function canPlace(model, ag, k, s) {
    var r = rangeFor(model, ag, k);
    if (s < r[0] || s > r[1]) return { ok: false, why: 'Outside the allowed window (' + fmt(r[0]) + '–' + fmt(r[1]) + ')' };
    if (overlapsFixed(ag, s, s + ag.acts[k].dur)) return { ok: false, why: 'Overlaps a fixed block' };
    return { ok: true };
  }

  function moveAct(model, ag, k, s) {
    var act = ag.acts[k];
    addInterval(model, ag, act.s, act.s + act.dur, -1);
    act.s = s;
    addInterval(model, ag, act.s, act.s + act.dur, 1);
  }

  // Best layout for ONE agent given everyone else (plain block-by-block moves
  // get stuck — moving a lunch often needs the next break to move too; the
  // joint re-placement doesn't). Accepted only if it lowers the total, unless
  // `force` (used by the 30-min quota). Returns the cost change, or null.
  function placeAgent(model, ag, force) {
    var lv = ag.lv, n = ag.acts.length;
    if (!n || !lv) return null;
    var old = ag.acts.map(function (a) { return a.s; });
    ag.acts.forEach(function (a) { addInterval(model, ag, a.s, a.s + a.dur, -1); });
    var curCost = 0;
    ag.acts.forEach(function (a) { curCost += addCost(model, ag, a.s, a.s + a.dur) + moveCost(model, a, a.s); });
    var sol = solveLayout(ag, lv, model.snap, model.live, function (act, k, st) { return addCost(model, ag, st, st + act.dur) + moveCost(model, act, st); });
    var take = sol && (force ? sol.cost < 1e5 : sol.cost < curCost - 1e-9);
    ag.acts.forEach(function (a, k) { a.s = take ? sol.starts[k] : old[k]; addInterval(model, ag, a.s, a.s + a.dur, 1); });
    return take ? sol.cost - curCost : null;
  }

  function bigMoves(model) {
    var out = [];
    model.agents.forEach(function (ag) { ag.acts.forEach(function (a) { if (!a.pinned && moveKind(model, a) === 30) out.push({ ag: ag, act: a }); }); });
    return out;
  }
  function movedCount(model) {
    var n = 0;
    model.agents.forEach(function (ag) { ag.acts.forEach(function (a) { var k = moveKind(model, a); if (k === 15 || k === 30) n++; }); });
    return n;
  }
  function bigAllowance(model) {
    var moved = movedCount(model), share = Number(model.moves.maxBigShare) || 0;
    return (moved && share > 0) ? Math.max(1, Math.round(share * moved)) : 0;
  }

  // Re-place agents one at a time, scarcest first, until a full pass changes
  // nothing (each accepted move strictly lowers the total, so this ends). Then
  // hold 30-min moves to their quota: first by making them dearer, then by
  // giving up the ones that buy the least.
  function optimize(model, opts) {
    opts = opts || {};
    var budget = opts.budgetMs != null ? opts.budgetMs : 1500, maxPass = opts.maxPass || 20;
    var t0 = Date.now(), passes = 0, moved = 0;
    var order = model.agents.filter(function (a) { return !a.fullAbsent && !a.infeasible && a.acts.some(function (x) { return !x.locked; }); })
      .sort(function (a, b) { return (b.w - a.w) || (a.S - b.S) || String(a.name).localeCompare(String(b.name)); });
    function run() {
      for (var p = 0; p < maxPass; p++) {
        passes++;
        var changed = 0;
        for (var i = 0; i < order.length; i++) if (placeAgent(model, order[i]) != null) changed++;
        moved += changed;
        if (!changed || Date.now() - t0 > budget) break;
      }
    }
    model.bigMult = 1;
    run();
    for (var r = 0; r < 4 && bigMoves(model).length > bigAllowance(model); r++) { model.bigMult *= 2; run(); }
    var reverted = 0;
    var big = bigMoves(model);
    if (big.length > bigAllowance(model)) {
      // Price each agent's 30-min move(s): re-solve with them forbidden.
      var seen = {}, cands = [];
      big.forEach(function (x) { if (!seen[x.ag.key]) { seen[x.ag.key] = 1; cands.push(x.ag); } });
      cands.forEach(function (ag) {
        var keep = ag.acts.map(function (a) { return a.s; });
        model.forbidBig = true;
        var delta = placeAgent(model, ag, true);
        model.forbidBig = null;
        ag.benefit = delta == null ? Infinity : delta;
        // put it back for now
        ag.acts.forEach(function (a, k) { if (a.s !== keep[k]) moveAct(model, ag, k, keep[k]); });
      });
      cands.sort(function (a, b) { return (a.benefit - b.benefit) || String(a.name).localeCompare(String(b.name)); });
      for (var c = 0; c < cands.length && bigMoves(model).length > bigAllowance(model); c++) {
        if (!isFinite(cands[c].benefit)) continue;
        model.forbidBig = true;
        if (placeAgent(model, cands[c], true) != null) reverted++;
        model.forbidBig = null;
      }
    }
    model.bigMult = 1;   // scores stay comparable with the baseline
    return { passes: passes, iterations: moved, reverted: reverted, ms: Date.now() - t0 };
  }

  // Full score and plain-language metrics for the current state.
  function score(model) {
    var pair = 0, idp = 0, ch = 0, frGap = 0, blOverlap = 0, srOverlap = 0, idpShort = 0, rawShort = 0;
    for (var t = 0; t < NSLOT; t++) {
      for (var g = 0; g < GROUPS.length; g++) {
        var s1 = model.S1[g][t], s2 = model.S2[g][t];
        if (s1) pair += model.f[g][t] * (s1 * s1 - s2) / 2;
      }
      var R = model.req[t], onQ = model.onShiftAll[t] - model.offAll[t];
      if (R >= 0) { idp += model.lambda * sq(R - onQ); if (onQ < R - 1e-9) idpShort += SLOT; }
      if (model.idpRaw[t] >= 0 && onQ < model.idpRaw[t] - 1e-9) rawShort += SLOT;
      var frc = G_IDX.FRC;
      if (model.onShift[frc][t] > 0 && model.onShift[frc][t] - model.offCnt[frc][t] <= 0 && model.offCnt[frc][t] > 0) frGap += SLOT;
      if (model.offCnt[G_IDX.BL][t] >= 2) blOverlap += SLOT;
      if (model.offCnt[G_IDX.SR][t] >= 2) srOverlap += SLOT;
    }
    var c = { 15: 0, 30: 0, fix: 0, added: 0 };
    model.agents.forEach(function (ag) { ag.acts.forEach(function (a) { ch += moveCost(model, a, a.s); var k = moveKind(model, a); if (k) c[k]++; }); });
    return { total: pair + idp + ch, overlap: pair, idp: idp, churn: ch, frGapMin: frGap, blOverlapMin: blOverlap, srOverlapMin: srOverlap, idpShortMin: idpShort, idpRawShortMin: rawShort,
      moves: c[15] + c[30] + c.fix, moved15: c[15], moved30: c[30], fixes: c.fix, added: c.added, bigAllowed: bigAllowance(model) };
  }

  // Per-slot coverage for the ribbon: on-queue by language, on shift, IDP.
  function coverage(model) {
    var out = { slot: SLOT, bl: [], fr: [], en: [], shift: [], req: [], need: [], frGap: [] };
    for (var t = 0; t < NSLOT; t++) {
      var bl = model.onShift[G_IDX.BL][t] - model.offCnt[G_IDX.BL][t];
      var fr = model.onShift[G_IDX.FR][t] - model.offCnt[G_IDX.FR][t];
      var en = model.onShift[G_IDX.EN][t] - model.offCnt[G_IDX.EN][t];
      out.bl.push(bl); out.fr.push(fr); out.en.push(en);
      out.shift.push(model.onShiftAll[t]);
      out.req.push(model.idpRaw[t] >= 0 ? model.idpRaw[t] : null);
      out.need.push(model.req[t] >= 0 ? model.req[t] : null);
      out.frGap.push(model.onShift[G_IDX.FRC][t] > 0 && bl + fr <= 0 && model.offCnt[G_IDX.FRC][t] > 0 ? 1 : 0);
    }
    return out;
  }

  // Plan rows to save / approve. `changed` = differs from the current floor.
  function exportPlan(model) {
    return model.agents.filter(function (ag) { return !ag.fullAbsent; }).map(function (ag) {
      var changed = ag.acts.some(function (a) { return a.orig == null || a.orig !== a.s || (a.origDur != null && a.origDur !== a.dur); });
      return {
        key: ag.key, name: ag.name, id: ag.id, hasOverride: ag.hasOverride, changed: changed,
        acts: ag.acts.map(function (a) { return { type: a.type, s: a.s, e: a.s + a.dur, unpaid: !!a.unpaid }; }),
        fixed: ag.fixed.filter(function (f) { return !f.extra; }).map(function (f) { return { type: f.type, s: f.s, e: f.e, rs: f.rs, re: f.re, abs: f.abs }; }),
        extra: ag.extra.map(function (b) { return { type: b.type, s: b.s, e: b.e }; })
      };
    });
  }

  function fmt(m) {
    if (m == null || isNaN(m)) return '—';
    var x = ((Math.round(m) % 1440) + 1440) % 1440;
    var h = Math.floor(x / 60), mi = x % 60;
    return (h < 10 ? '0' : '') + h + ':' + (mi < 10 ? '0' : '') + mi;
  }

  var api = {
    SLOT: SLOT, NSLOT: NSLOT, GROUPS: GROUPS, DEFAULT_RULES: DEFAULT_RULES,
    mergeRules: mergeRules, parseSeq: parseSeq, ruleFor: ruleFor, agentWeight: agentWeight,
    buildModel: buildModel, optimize: optimize, score: score, coverage: coverage,
    rangeFor: rangeFor, canPlace: canPlace, moveAct: moveAct, exportPlan: exportPlan, moveKind: moveKind,
    validLayout: validLayout, staticBounds: staticBounds, fmt: fmt
  };
  root.WFEngine = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : this);
</script>
